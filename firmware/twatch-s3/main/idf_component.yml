#
# Super Spectral - external dependencies (IDF Component Manager 3.x).
# Policy (ADR 0001): tilde pins + a COMMITTED dependencies.lock.
#   ~1.2.3  ==>  >=1.2.3,==1.2.*   (patch releases only; no silent minors)
# The lock does not exist yet: it is generated by the E1 gate build
# (`idf.py reconfigure`) and committed then. Bump deliberately with
# `idf.py update-dependencies` and commit the lock in the same change.
#
# NO `rules:` / `if:` / `path:` / `override_path:` entries in this file - they
# make dependencies.lock environment-specific and therefore uncommittable.
# Never add espressif/arduino-esp32 (LGPL-2.1, forces Wi-Fi, anchors IDF 5.5;
# ADR 0004). Only MIT / BSD / Apache-2.0 components may enter the link line;
# each one is listed in NOTICE.
#
# Versions were read from components.espressif.com on 2026-08-20.
dependencies:
  # The IDF line this manifest is valid for (ADR 0001 pins v6.0.2; v6.1.x is
  # the planned hop after v6.1.1/v6.1.2 via docs/devenv/upgrade-procedure.md).
  idf: ">=6.0,<6.2"

  # DSP kernels: radix-2/4 complex FFT (no real-FFT entry point -- the real path
  # is composed by hand), six symmetric windows (Hann, Blackman,
  # Blackman-Harris, Blackman-Nuttall, Nuttall, flat-top), FIR/IIR, dot
  # products - Xtensa LX7 + S3 PIE paths. Apache-2.0. 1.8.2 = 2026-05-11.
  # Consumed ONLY by components/spectral_fft_backend (ADR 0006 keeps
  # spectral_core free of it so the host build needs no esp-dsp).
  espressif/esp-dsp: "~1.8.2"

  # UI toolkit for chrome (menus, readouts, note ladder). MIT. 9.5.0 = 2026-02-18.
  # The analyzer canvas itself may bypass LVGL (ADR 0007, gated on the ST7789
  # scroll-axis check).
  lvgl/lvgl: "~9.5.0"

  # Glue: LVGL task, tick, esp_lcd + esp_lcd_touch adapters, partial-buffer
  # handling. Apache-2.0. 2.9.0 = 2026-08-07 (requires idf>=5.2, lvgl>=8,<10).
  espressif/esp_lvgl_port: "~2.9.0"

  # Touch: the FT6336U at I2C 0x38 is register-compatible with the FT5x06
  # driver (same FocalTech map: 0x02 TD_STATUS, 0x03-0x06 P1_XH..YL) and
  # esp_lcd_touch_new_i2c_ft5x06() performs no chip-ID check. Cap
  # max_point_num at 2 (FT6336U is two-point). Apache-2.0. 1.1.1 = 2026-08-12.
  # Pulls espressif/esp_lcd_touch transitively.
  espressif/esp_lcd_touch_ft5x06: "~1.1.1"

  # AXP2101 (fallback only - own ~300-line driver planned), BMA423, PCF8563,
  # DRV2605L. MIT, native ESP-IDF platform layer (src/platform/espidf/).
  # BMA423 must NOT be hand-rolled: step/tilt/tap need Bosch's binary
  # feature-config blob, which SensorLib bundles. Requires
  # CONFIG_SENSORLIB_ESP_IDF_NEW_API=y (driver/i2c_master.h on IDF 6); the
  # per-driver CONFIG_SENSORLIB_EXCLUDE_* trims are added to sdkconfig.defaults
  # once the lock exists and kconfgen can see the component's Kconfig.
  # 0.4.1 = 2026-04-11.
  lewisxhe/sensorlib: "~0.4.1"

  # MAX98357A I2S DAC abstraction for the calibration-tone path (I2S1 only;
  # PDM RX owns I2S0 - ADR 0003). Apache-2.0. 1.6.2 = 2026-07-23.
  # NOT the 2.0.0 betas: they pull usb_host_uac and exclude idf 5.5.0-5.5.2.
  espressif/esp_codec_dev: "~1.6.2"

  # Presets partition (littlefs, 1 MB): wear-levelled, power-fail safe, many
  # tiny blobs. SPIFFS is effectively unmaintained. Wrapper MIT; upstream ARM
  # littlefs BSD-3-Clause (both in NOTICE). 1.22.3 = 2026-07-21.
  joltwallet/littlefs: "~1.22.3"

# Deliberately ABSENT:
#  - ST7789V3 panel: esp_lcd_new_panel_st7789() is in-tree
#    (components/esp_lcd/src/esp_lcd_panel_st7789.c, header
#    esp_lcd_panel_st7789.h, also via esp_lcd_panel_vendor.h). There is no
#    espressif/esp_lcd_st7789 on the registry (404 confirmed 2026-08-20).
#  - jgromes/radiolib ~7.7.1 (MIT, native ESP-IDF HAL): SX1262 is out of
#    scope for v1 (ADR 0017). Add it here, never as a git submodule.
#  - espressif/esp_lcd_qemu_rgb ^1.0.2: added together with the
#    display_backend qemu_rgb seam, not before.
