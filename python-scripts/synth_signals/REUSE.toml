#
# Files in this package that cannot carry a comment header: uv.lock is
# generated (rewritten by `uv lock`, so a hand-added header would not survive)
# and .python-version is a bare version string. Same mechanism as host/REUSE.toml,
# opposite side of the ADR 0004 licence boundary.
version = 1

[[annotations]]
path = ["uv.lock", ".python-version"]
SPDX-FileCopyrightText = "2026 Alexander Gomez"
SPDX-License-Identifier = "Apache-2.0"
