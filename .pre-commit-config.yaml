#
# Super Spectral pre-commit configuration.
# Install:  pipx install pre-commit && pre-commit install && pre-commit install -t commit-msg
#           (pipx, not `pip install --user` and not `uvx`: `pre-commit install` writes the
#            interpreter path into .git/hooks/pre-commit, so the tool must stay on PATH.)
# Manual-stage hooks (need an activated ESP-IDF shell):  pre-commit run --hook-stage manual -a
#
# Every `rev:` below was current on 2026-08-20 unless marked VERIFY. Run
# `pre-commit autoupdate` deliberately, never casually: a clang-format major bump
# reformats the whole tree (pitfall B20, docs/devenv/pitfalls.md).
default_stages: [pre-commit]
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: &generated '(?x)^(.+\.(md|bin|map|csv|f32|wav)|.+/golden/.+|.+/ref_imgs/.+|docs/OCR/manifest\.tsv)$'
      - id: end-of-file-fixer
        exclude: *generated
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: *generated
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        # The reference library is excluded from the SIZE check, not waived: its 12 tracked
        # PDFs are bimodal (0.15-1.3 MB papers, 2.5-15 MB vendor docs), so any cap that lets
        # the legitimate ones through lets everything through, and a cap people routinely
        # SKIP= is not a guard. Size was never the rule that was broken for a PDF -- licence
        # was -- and the `pdf-redistributable` local hook below is that rule. Outside the
        # library (a factory-backup .bin, a WAV) 1 MB still bites.
        exclude: '^docs/(papers|datasheets|standards|reports|app-notes|books)/.*\.pdf$'
      - id: check-yaml
        exclude: '^\.clangd$|^\.clang-format$'   # clangd/clang-format YAML is multi-document with a leading comment block
      - id: check-json
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: ["--config=.codespellrc"]
        exclude: '^docs/research/|^docs/OCR/manifest\.tsv$'

  # PIN THE MAJOR: clang-format 20.1.8 == esp-clang 20.1.1 shipped with ESP-IDF v6.0.x.
  # mirrors-clang-format's newest tag on 2026-08-20 was v22.1.8; a major bump reformats everything.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v20.1.8
    hooks:
      - id: clang-format
        types_or: [c, c++]
        exclude: '(^|/)(managed_components|build|build_[^/]+)/'

  # Kconfig linting — pinned to 3.x because ESP-IDF v6.0 constrains esp-idf-kconfig>=3.2.0,<4.0.0
  # (https://dl.espressif.com/dl/esp-idf/espidf.constraints.v6.0.txt — cite the URL, never a host copy).
  - repo: https://github.com/espressif/esp-idf-kconfig.git
    rev: v3.12.0
    hooks:
      - id: check-kconfig-files
      - id: check-deprecated-kconfig-options

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0                          # verified 2026-08-21: first `pre-commit run -a`, 5 findings, all addressed
    hooks:
      - id: shellcheck
        args: ["-x", "-e", "SC1091"]
        files: '\.sh$|^\.envrc$'
        types: [text]

  # SPDX / REUSE compliance. Runs at the manual stage until a REUSE.toml exists that
  # covers the Markdown library (reuse lint otherwise fails on every un-annotated .md).
  - repo: https://github.com/fsfe/reuse-tool
    rev: v5.0.2                           # verified 2026-08-21: runs; still manual-stage until a REUSE.toml covers the .md library
    hooks:
      - id: reuse
        stages: [manual]

  - repo: https://github.com/espressif/conventional-precommit-linter
    rev: v1.11.0
    hooks:
      - id: conventional-precommit-linter
        stages: [commit-msg]
        # Types are the repo's own subject prefixes (CLAUDE.md "When to commit"), not the
        # tool's default list, which rejected 54 of the 54 subjects on the first branch.
        # ADR records use `ADR(0006): ...` -- the linter's type token cannot contain a space.
        # --summary-uppercase dropped: with it absent the linter checks no case at all
        # (read from hook.py), which is what a convention of `docs: lowercase subject` needs.
        # `web` (added 2026-08-22, ADR 0021): the host web application -- front end
        # `host/web/` and backend `host/src/spectral_host/web/`. It is the prefix for
        # roadmap track W's milestone commits, which is what ticks a W-track DoD box.
        args: ["--types=ADR,adr,change,chore,ci,datasets,devenv,docs,feat,firmware,fix,golden,host,protocols,refactor,remove,revert,test,web",
               "--subject-min-length=8", "--subject-max-length=100"]

  - repo: local
    hooks:
      # 0. Only documents whose OCR-manifest row says redistributable=yes may be tracked
      #    (docs/OCR/README.md; docs/bibliography/acquisition-status.md). On 2026-08-21 an
      #    11 MB vendor manual filed as `unknown` -- "local only, not committed" in four of
      #    the repo's own records -- was committed anyway, because nothing read column 11 of
      #    the manifest. This does. A PDF with no manifest row fails too, so every tracked
      #    PDF is also extracted and ledgered. It had to be removed from the branch's history
      #    before the first push; this hook is why that cannot recur.
      - id: pdf-redistributable
        name: every tracked PDF has redistributable=yes in docs/OCR/manifest.tsv
        language: system
        entry: >-
          bash -c 'm=docs/OCR/manifest.tsv; rc=0; for f in "$@"; do
          v=$(awk -F"\t" -v s="$f" "NR>1 && \$1==s {print \$11; exit}" "$m");
          case "$v" in yes) ;;
          "") echo "$f: no row in $m -- run doc_ocr extract and set redistributable (docs/OCR/README.md)"; rc=1 ;;
          *) echo "$f: redistributable=$v in $m -- only yes may be tracked (docs/OCR/README.md)"; rc=1 ;; esac;
          done; exit $rc' --
        files: '\.pdf$'

      # 1. Every code/config file carries an SPDX identifier (BRIEF rule 6; feeds esp-idf-sbom).
      #    python-scripts/doc_ocr/ is NOT excluded: it originates from the author's swarm repo
      #    (MIT, same author) and carries SPDX + `Origin:` header lines here -- see NOTICE.
      - id: spdx-header
        name: SPDX-License-Identifier present in code/config files
        language: system
        entry: >-
          bash -c 'rc=0; for f in "$@"; do grep -q "SPDX-License-Identifier:" "$f"
          || { echo "missing SPDX header in $f"; rc=1; }; done; exit $rc' --
        files: '(\.(c|h|cpp|hpp|py|sh|cmake|ya?ml|toml)|CMakeLists\.txt|\.envrc|\.clangd|\.clang-format|\.editorconfig|\.codespellrc|Kconfig(\.projbuild)?|idf_component\.yml|sdkconfig\.[a-z0-9.]+|firmware/twatch-s3/partitions\.csv)$'
        exclude: '(^|/)(managed_components|build|build_[^/]+|scratch|docs/reference-projects/clones)/|^docs/OCR/manifest\.tsv$|dependencies\.lock$'

      # 2. GPIO19/GPIO20 are the USB-Serial-JTAG D-/D+ pins — the ONLY recovery path on a
      #    sealed board with zero exposed GPIO. A literal 19/20 near any GPIO API or pin
      #    macro is a commit failure. Comment lines (`/*`, ` *`, `//`) are skipped so the
      #    rule may be *explained* in code. String literals are blanked before matching for
      #    the same reason: `_Static_assert(PIN_LCD_BL != 20, "GPIO19/20 are USB-Serial-JTAG")`
      #    is the rule being ENFORCED, and the hook must read code, not message text.
      #    twatch_pins.h is excluded because it is the file
      #    that IMPLEMENTS the rule (TWATCH_ASSERT_NOT_USJ + the two reserved USB defines)
      #    and is policed by hook 2b instead. Complements the _Static_asserts (ADR 0015).
      - id: no-usb-pins
        name: GPIO19/20 are USB-Serial-JTAG — never referenced in firmware sources
        language: system
        entry: >-
          bash -c 'rc=0; for f in "$@"; do
          hits=$(sed "s/\"[^\"]*\"/\"\"/g" "$f"
          | grep -nE "GPIO_NUM_(19|20)\b|\bGPIO(19|20)\b|\b(gpio_config|gpio_reset_pin|gpio_set_direction|gpio_set_level|gpio_set_pull_mode|gpio_iomux_out|gpio_iomux_in|esp_rom_gpio_pad_select_gpio)\b[^;]*[^0-9.x](19|20)\b|^\s*#\s*define\s+\w*(PIN|GPIO|IO)\w*\s+\(?(19|20)\b" -
          | grep -vE "^[0-9]+:\s*(/\*|\*|//)");
          if [ -n "$hits" ]; then printf "%s\n" "$hits" | sed "s|^|$f:|"; rc=1; fi; done;
          [ $rc -eq 0 ] || echo "GPIO19/20 (USB-Serial-JTAG) referenced above — forbidden (ADR 0015)"; exit $rc' --
        files: '^firmware/.*\.(c|h|cpp|hpp)$'
        exclude: '(^|/)(managed_components|build|build_[^/]+)/|^firmware/twatch-s3/components/twatch_bsp/include/twatch_pins\.h$'

      # 2b. In twatch_pins.h the ONLY macros allowed to equal 19 or 20 are the two reserved
      #     USB names, and both must stay present so TWATCH_ASSERT_NOT_USJ keeps its meaning.
      - id: pins-h-usb-reserved-only
        name: twatch_pins.h assigns 19/20 only to TWATCH_PIN_USB_DN/DP
        language: system
        entry: >-
          bash -c 'f=firmware/twatch-s3/components/twatch_bsp/include/twatch_pins.h; rc=0;
          grep -qE "^\s*#\s*define\s+TWATCH_PIN_USB_DN\s+19\b" "$f" || { echo "$f: TWATCH_PIN_USB_DN 19 missing"; rc=1; };
          grep -qE "^\s*#\s*define\s+TWATCH_PIN_USB_DP\s+20\b" "$f" || { echo "$f: TWATCH_PIN_USB_DP 20 missing"; rc=1; };
          grep -q "TWATCH_ASSERT_NOT_USJ" "$f" || { echo "$f: TWATCH_ASSERT_NOT_USJ missing"; rc=1; };
          if grep -nE "^\s*#\s*define\s+\w+\s+\(?(19|20)\b" "$f" | grep -vE "TWATCH_PIN_USB_D[NP]\b"; then
          echo "$f: a pin macro other than TWATCH_PIN_USB_DN/DP equals 19/20 (ADR 0015)"; rc=1; fi; exit $rc'
        files: '^firmware/twatch-s3/components/twatch_bsp/include/twatch_pins\.h$'
        pass_filenames: false

      # 3. sdkconfig.defaults must carry the anti-brick / no-radio / no-crypto invariants verbatim.
      #    Symbols verified against the ESP-IDF v6.0.1 tree on 2026-08-20:
      #    SECURE_BOOT, SECURE_FLASH_ENC_ENABLED (components/bootloader/Kconfig.projbuild),
      #    ESP_WIFI_ENABLED (components/esp_wifi/Kconfig — promptless in v6.0.x, so the line is
      #    declarative and may be written commented out, `# CONFIG_ESP_WIFI_ENABLED=n`; the effective
      #    guard is that no component REQUIRES esp_wifi, pitfall H11),
      #    BT_ENABLED (components/bt/Kconfig), ESP_CONSOLE_USB_SERIAL_JTAG (components/esp_stdio/Kconfig).
      - id: sdkconfig-invariants
        name: sdkconfig.defaults keeps SECURE_*=n, coredump+rollback=y, console=USB-Serial-JTAG; CMakeLists trims COMPONENTS
        language: system
        entry: >-
          bash -c 'f=firmware/twatch-s3/sdkconfig.defaults; rc=0;
          for want in CONFIG_SECURE_BOOT=n CONFIG_SECURE_FLASH_ENC_ENABLED=n CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=y CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH=y CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y;
          do grep -qxF "$want" "$f" || { echo "$f lacks the line $want"; rc=1; }; done;
          grep -qE "^set\(COMPONENTS main\)" firmware/twatch-s3/CMakeLists.txt || { echo "firmware/twatch-s3/CMakeLists.txt lacks set(COMPONENTS main) - ADR 0017: no lwIP/Wi-Fi/BT in the build"; rc=1; };
          if grep -nE "^CONFIG_(SECURE_BOOT|SECURE_FLASH_ENC_ENABLED|ESP_WIFI_ENABLED|BT_ENABLED)=y" firmware/twatch-s3/sdkconfig.defaults* firmware/twatch-s3/sdkconfig.ci.* 2>/dev/null;
          then echo "forbidden =y above"; rc=1; fi; exit $rc'
        files: '^firmware/twatch-s3/sdkconfig\.'
        pass_filenames: false

      # 4. partitions.csv arithmetic: no overlaps, first entry at/after 0x9000 (table at 0x8000 +
      #    one 4 KiB sector), app partitions 64 KiB-aligned, data 4 KiB-aligned, last partition ends
      #    at exactly 0x1000000 (16 MiB), ota_0/ota_1 present, no factory partition (ADR 0014).
      #    Alignment gaps (phy_init -> ota_0) are legal. Pure python, no IDF needed.
      - id: partitions-arithmetic
        name: partitions.csv is overlap-free, aligned and ends at exactly 16 MiB
        language: python
        entry: >-
          python3 -c "import csv,sys;
          R=[[c.strip() for c in r] for r in csv.reader(l for l in open(sys.argv[1]) if l.strip() and not l.lstrip().startswith('#'))];
          T=[(r[0],r[1],int(r[3],0),int(r[4],0)) for r in R];
          A=lambda t:0x10000 if t=='app' else 0x1000;
          bad=[n for i,(n,t,o,s) in enumerate(T) if o<(0x9000 if i==0 else T[i-1][2]+T[i-1][3]) or o%A(t) or s%A(t)];
          end=T[-1][2]+T[-1][3]; names=[n for n,*_ in T];
          msgs=['overlap or misalignment at partition '+n for n in bad]
          +(['table ends at %#x, expected 0x1000000'%end] if end!=0x1000000 else [])
          +['missing partition '+x for x in ('nvs','otadata','ota_0','ota_1','coredump') if x not in names]
          +(['factory partition present; ADR 0014 forbids it'] if 'factory' in names else []);
          print(*msgs,sep=chr(10)); sys.exit(bool(msgs))"
        files: '^firmware/twatch-s3/partitions\.csv$'

      # 5. The shipped presets are a protocol: the watch validates and rejects, it
      #    never coerces. This runs the schema plus loader rules V0-V10 (canonical
      #    form, id/filename, watch limits, window-coefficient and resolution
      #    recomputation to 1e-6, provisional pointers) over every preset, and a
      #    negative-case suite that must stay rejected. jsonschema is optional --
      #    without it the rules still run and the schema pass is skipped loudly.
      - id: presets-rules
        name: presets satisfy the schema and loader rules V0-V10
        language: system
        entry: python3 python-scripts/check_presets.py
        files: '^(protocols/presets/.*\.json|protocols/specs/presets\.schema\.json|python-scripts/check_presets\.py)$'
        pass_filenames: false

      # 5b. Every unresolved-value marker is either CLOSED (a correction that must not
      #     come undone) or ALLOWED (it remains, and a named person owns it). On
      #     2026-08-20 a correction written into ADR 0016 survived in eleven other
      #     files for a day because nothing counted them; on 2026-08-21 four items
      #     were handed back as "decisions" when three were lookups. This is the
      #     arithmetic that makes both visible. Bare `TBD` is NOT scanned -- CLAUDE.md
      #     sanctions it; the tagged `TBD (datasheet ...)` form is.
      - id: markers-baseline
        name: every (verify)/(prov.)/unread marker is closed or owned
        language: system
        entry: >-
          python3 python-scripts/check_markers.py
          --closed docs/roadmap/markers-closed-2026-08-21.tsv
          --allow docs/roadmap/markers-allowlist.tsv
        files: '\.(md|yaml|yml|csv|h|json|toml)$'
        exclude: '(^|/)(managed_components|build|build_[^/]+|scratch)/|/clones/|\.ocr'
        pass_filenames: false

      # 5c. ADR 0009 item 4: "a commit may not both regenerate vectors and change a
      #     tolerance -- two changes, two commits, two reasons". The record names this
      #     hook as its Phase-1 deliverable: refuse a commit whose STAGED set touches both
      #     host/golden/outputs/ (the vectors and their manifests) and
      #     docs/validation/golden-files.md (the only place a limit is defined). File-level
      #     on purpose -- a widened limit is exactly the kind of edit that hides in a diff
      #     of a prose table. When nothing is staged (`pre-commit run -a`, the CI
      #     guard-hooks loop) it checks the HEAD commit instead, so the CI run is an
      #     assertion about the tip and not a no-op; a merge commit has no single diff and
      #     passes. The escape is two commits, not SKIP=. Fails closed (exit 2) when HEAD is
      #     the cut of a shallow clone: git then reports HEAD as parentless and
      #     `diff-tree --root` lists the WHOLE tree, which would trip the rule on every push
      #     the moment both paths exist -- measured 2026-08-21 in a `--depth 1` clone of an
      #     empty commit: 354 files "changed". The CI checkout uses fetch-depth 2 for this.
      - id: golden-regen
        name: golden vectors and the tolerance table never change in the same commit (ADR 0009)
        language: system
        entry: >-
          bash -c 'set=$(git diff --cached --name-only --diff-filter=ACDMR);
          if [ -n "$set" ]; then src="staged set";
          else src="HEAD commit $(git rev-parse --short HEAD)";
          if [ "$(git rev-parse --is-shallow-repository)" = true ] && grep -qx "$(git rev-parse HEAD)" "$(git rev-parse --git-path shallow)"; then
          echo "golden-regen: HEAD is the cut of a shallow clone -- its parent is absent, so its diff cannot be taken; fetch depth >= 2 (refusing to pass)"; exit 2; fi;
          set=$(git diff-tree --no-commit-id --name-only -r --root HEAD); fi;
          o=$(printf "%s\n" "$set" | grep -c "^host/golden/outputs/" || true);
          t=$(printf "%s\n" "$set" | grep -cx "docs/validation/golden-files.md" || true);
          if [ "$o" -gt 0 ] && [ "$t" -gt 0 ]; then
          echo "golden-regen: the $src touches $o file(s) under host/golden/outputs/ AND docs/validation/golden-files.md";
          echo "ADR 0009 item 4: regenerate in one commit (golden: ...), change the tolerance in another, each with its reason";
          exit 1; fi;
          echo "golden-regen: $src -- outputs: $o, tolerance table: $t -- ok"'
        files: '^(host/golden/outputs/|docs/validation/golden-files\.md$)'
        pass_filenames: false

      # 5d. The licence boundary is the directory (ADR 0004): host/ is GPL-3.0-or-later
      #     because it imports parselmouth in-process; everything else is Apache-2.0; the
      #     two halves exchange files on disk and never import each other. Four greps,
      #     mirrored one-for-one by the `host` CI job: (a) no file outside host/ DECLARES
      #     itself GPL in its header (first 5 lines -- prose mentions in ADRs and NOTICE
      #     are not violations); (b) `spectral_host` is imported nowhere outside host/;
      #     (c) no .py under host/ (src, tests, golden alike -- CLAUDE.md: "nothing
      #     outside host/ is imported by host/") imports an Apache package; (d) host/src
      #     never edits sys.path (the one way a checkout-relative import could cross the
      #     directory without an install; host/tests may READ it -- test_env.py does, to
      #     prove the boundary). Runs on every commit: four `git grep`s cost nothing.
      - id: host-boundary
        name: licence boundary — GPL headers and imports stay inside host/, Apache imports stay out
        language: system
        entry: >-
          bash -c 'rc=0;
          bad=$(git ls-files -z -- . ":!host" | while IFS= read -r -d "" f; do
          [ -f "$f" ] && head -n 5 -- "$f" | grep -qE "SPDX-License-Identifier:.*GPL" && echo "$f"; done);
          if [ -n "$bad" ]; then printf "%s\n" "$bad" | sed "s|$|: GPL SPDX header outside host/|"; rc=1; fi;
          if git grep -nE "^(from|import) spectral_host" -- . ":!host"; then echo "spectral_host (GPL) imported outside host/"; rc=1; fi;
          if git grep -nE "^(from|import) (synth_signals|golden_compare|check_presets|doc_ocr)" -- ":(glob)host/**/*.py"; then echo "host/ imports from python-scripts/"; rc=1; fi;
          if git grep -n "sys\.path" -- host/src; then echo "host/src edits sys.path"; rc=1; fi;
          [ $rc -eq 0 ] || echo "licence boundary crossed -- ADR 0004: host/ and python-scripts/ exchange files on disk only";
          exit $rc'
        pass_filenames: false

      # 6. Needs an activated ESP-IDF shell: the lock must match the manifest.
      - id: lockfile-matches-manifest
        name: dependencies.lock is up to date (manual stage; needs idf.py)
        language: system
        entry: >-
          bash -c 'cd firmware/twatch-s3 && idf.py reconfigure >/dev/null && git diff --exit-code -- dependencies.lock'
        files: '(idf_component\.yml|dependencies\.lock)$'
        pass_filenames: false
        stages: [manual]

      # 7. Needs an activated ESP-IDF shell: the authoritative partition-table check.
      - id: gen-esp32part
        name: gen_esp32part.py accepts partitions.csv for a 16MB flash (manual stage)
        language: system
        entry: >-
          bash -c 'python3 "$IDF_PATH/components/partition_table/gen_esp32part.py" --flash-size 16MB -q firmware/twatch-s3/partitions.csv /dev/null'
        files: '^firmware/twatch-s3/partitions\.csv$'
        pass_filenames: false
        stages: [manual]
