  - name: demand
    # Corrected 2026-08-21 (was `2`). The scale in ../README.md is "0 synthetic - 1
    # clean licence + f0 ground truth - 2 restricted or non-commercial - 3 voice
    # quality / pathology - N noise / RIR". DEMAND is neither restricted nor
    # non-commercial on either reading of its licence, and the same README, plus
    # bibliography 10 (#20, section E "Noise corpora") and the noise/RIR row of
    # docs/validation/README.md, all class it as noise. Quoted for the same reason
    # `clinical_claim` is: the YAML 1.1 bool type resolves `y|Y|yes|...|n|N|no|...`,
    # so a bare N is FALSE under a spec-conformant 1.1 parser and the string "N"
    # under YAML 1.2 -- and the loader must not be the thing that decides. (PyYAML's
    # own bool regex happens to omit bare y/N, so `python3 -c` will not reproduce the
    # trap; other parsers do. The quoting is defensive, not PyYAML-specific.)
    tier: "N"
    version: "Zenodo record 1227121"
    source:
      zenodo: https://zenodo.org/records/1227121
      paper: https://hal.science/hal-00796707
