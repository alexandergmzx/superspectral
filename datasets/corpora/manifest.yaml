  # Named in ADR 0005 as one of the two Tier-3 corpora the validation plan feeds.
  # LICENCE FOUND 2026-08-21, and it lifts the quarantine this entry was created
  # with. The live site has no terms page at all -- "Terms & Conditions" is a
  # footer HEADING over /imprint (a TMG Impressum) and a privacy link, and
  # /terms, /nutzungsbedingungen and the legacy /help_en.php4 are all 404. The
  # licence lives on the Zenodo deposit of the whole database instead: CC BY 4.0.
  # Keys introduced on this date and not present in the other entries:
  # `doi`, `index_csv`, `bulk_download`, `native_format`, `site_terms_note`,
  # `licence.attribution`.
  - name: saarbruecken-voice-database
    tier: 3
    version: >-
      Zenodo record 16874898. The record's `metadata.version` is null -- it has no
      version string; `publication_date` is 2008. Cite the record DOI, not a version.
    source:
      url: https://stimmdb.coli.uni-saarland.de/
      doi: 10.5281/zenodo.16874898
      terms_page: https://zenodo.org/records/16874898   # the licence is here, not on the site
      index_csv: https://stimmdb.coli.uni-saarland.de/data/voice_data.csv
      institution: >-
        Created at the former Institut fuer Phonetik, Universitaet des Saarlandes;
        hosted and managed since 2025 by Universitaetsklinikum Essen.
      paper: >-
        Barry, W. J. & Puetzer, M. (2007). Saarbruecken Voice Database. Institut fuer
        Phonetik, Universitaet des Saarlandes. Note the Zenodo deposit lists the
        creators in the other order (Puetzer, Barry) -- see licence.attribution.
      bulk_download: >-
        73 files on the Zenodo record: data.zip 17,881,176,281 B
        (md5 8314013ccf4830ca732486206fbed9e6), healthy.zip 6,020,018,616 B
        (md5 67789ec89a161ce26d562719bc8d1aaa), and 71 per-pathology zips.
        17.9 GB for the whole set -- far over the 1 GB session rule, so a fetch is
        planned and subset-first, never casual.
      native_format: >-
        .nsp (Kay CSL) plus a separate EGG file per case; the Zenodo description
        links a converter to .wav. Confirm the conversion path at fetch.
      mirdata_loader: null      # no loader
    licence:
      spdx: CC-BY-4.0
      attribution: >-
        Puetzer, Manfred; Barry, William J. -- Saarbruecken Voice Database, Zenodo,
        doi:10.5281/zenodo.16874898, CC BY 4.0. (Creator order as the licensor
        registered it; the canonical bibliographic citation is Barry & Puetzer 2007.)
      statement_found: >-
        Zenodo record rights id `cc-by-4.0`. The site separately says "Free and
        Open-Source" and "Free to use for reproducible voice science", which is not
        a licence; the Zenodo record is the one that grants rights.
      read_at: https://zenodo.org/api/records/16874898
      read_on: 2026-08-21
      site_terms_note: >-
        No terms page exists on the live site (verified 2026-08-21): the "Terms &
        Conditions" footer heading covers /imprint and uk-essen.de/datenschutz only,
        and /terms, /terms-and-conditions, /nutzungsbedingungen and /help_en.php4
        all return 404. Do not cite the site for licence terms.
    ground_truth:
      - clinician-assigned pathology labels (never used as targets -- see clinical_claim)
      - simultaneous electroglottographic (EGG) signal, so a reference f0 is derivable
    content: >-
      German speakers, healthy and pathological. Sustained [i:] [a:] [u:] at normal,
      high and low pitch and with rising/falling pitch, plus the sentence "Guten
      Morgen, wie geht es Ihnen?", with a simultaneous EGG channel.
      Counts computed from the site's own index CSV on 2026-08-21 (not from the
      landing page, which states none of them): 2 225 recording sessions from
      1 853 distinct speakers; 869 sessions typed `n` and 1 356 typed `p`; 854
      speakers have at least one normal session, 1 020 at least one pathological,
      21 have both; 1 163 sessions from female and 1 062 from male speakers;
      1 038 distinct free-text diagnoses; recording dates 1997-11-20 to 2004-06-16.
      Pathology labels: 71 distinct labels, appearing in 186 distinct combinations
      (the `Pathologien` column is comma-separated and multi-label -- counting the
      raw strings gives 186, not 71).
      NOTE the widely quoted "1 356 patients" is 1 356 *pathological sessions*, and
      "687 healthy" matches nothing in the current index.
      Sample rate 50 kHz / 16-bit with a separate EGG file per case is stated in the
      SVD literature, NOT on the site or the Zenodo record -- confirm at fetch.
    files: []
    preprocessing:
      resample_to_hz: 32000
      resampler: soxr VHQ via python-scripts (recorded with its version)
      level_normalisation: ITU-T P.56 active speech level, target recorded per run
      channels: mono; the EGG channel is kept separate and never mixed into the audio
    use:
      - row: "EGG-derived reference f0 vs the watch's f0 on sustained vowels"
        path: injection
    use_note: >-
      The EGG channel is the reason to want this corpus: it gives a reference f0 that
      does not come from another pitch tracker. The pathology labels are acoustic
      metadata here and nothing else (ADR 0005 rule 4).
    clinical_claim: "no"   # quoted: bare no is a YAML 1.1 boolean. ADR 0005 rule 4: audio may be used, labels are never targets
    restrictions:
      flags: [pathological-voice-material, headline-use-pending-q41]
      consequence: >-
        The LICENCE quarantine is lifted (2026-08-21): CC BY 4.0 permits use and
        redistribution with attribution, so `unstated-terms` and `no-bulk-export`
        no longer apply and the policy.quarantine_rule above does not bite.
        Two constraints remain and neither is a licence question. (1) ADR 0005 is
        unchanged: audio is acoustic material, labels are never targets, no
        classifier, no per-voice statement, no sensitivity/specificity/ROC/AUC.
        (2) Whether a clinician-labelled pathology corpus contributes to a HEADLINE
        metric at all is roadmap Q41 -- an ethics call for the owner, not a lookup.
        Until Q41 is answered, treat as bench-and-exploratory.

