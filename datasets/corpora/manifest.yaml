#
# Corpus manifest — the contract described in ../README.md.
#
# STATUS 2026-08-21: PRE-REGISTRATION, not an inventory. Nothing here is
# downloaded yet. Every `files:` block is empty and every `sha256` absent by
# design: those arrive with the fetch (roadmap D6/Phase 2) and are what makes a
# run reproducible. Fields marked `verify:` are claims read from a catalogue
# page, not from the downloaded record, and must be confirmed at fetch time.
#
# Rules this file obeys (../README.md, docs/validation/README.md):
#   * Audio is gitignored; this manifest is tracked. The pair is the dataset.
#   * Licence is recorded with the URL where the terms were read AND the date.
#   * NC / request-only / unstated corpora are QUARANTINED from headline
#     metrics: usable on the bench, never in a number that leaves the project.
#   * `use:` names the validation row and the measurement path, so an unused
#     corpus is visible as unused.
#   * Preprocessing is recorded so the injection path is reproducible; level
#     normalisation is ITU-T P.56 active speech level, never peak.

version: 0
generated: 2026-08-21
generator: hand-written (pre-registration); refreshed by python-scripts/ fetch tooling in D6
policy:
  audio_tracked: false
  checksums: sha256 per file, written at fetch time
  loader: mirdata where a loader exists (validates checksums against the canonical release)
  quarantine_rule: >-
    A corpus whose licence is NC, request-only or unstated may support bench work and
    exploratory analysis; it may not contribute to a headline metric or to any figure
    that leaves the project. The `restrictions.consequence` field states this per corpus.
  clinical_claim_rule: >-
    Every entry carries `clinical_claim: "no"` — quoted, because a bare `no` is a boolean under YAML 1.1 and the string `"no"` under YAML 1.2, and the loader must not be the thing that decides. It is not a licence field: it records that
    the corpus's audio may be used as acoustic material while its labels are never used
    as targets, and that no sensitivity, specificity, ROC or AUC against those labels is
    computed or published (ADR 0005 rule 4). The field is `no` for every corpus in this
    file and there is no value it may take other than `no`.

datasets:

  - name: vocadito
    tier: 1
    version: "1.0 (Zenodo record 5578807)"
    source:
      zenodo: https://zenodo.org/records/5578807
      doi: 10.5281/zenodo.5578807   # verify: record-level DOI at fetch time
      paper: bibliography 05 #58 (Bittner et al. 2021, ISMIR LBD)
      mirdata_loader: vocadito
    licence:
      spdx: CC-BY-4.0
      read_at: https://zenodo.org/records/5578807
      read_on: 2026-08-20
    ground_truth:
      - frame-level f0 (CSV)
      - note annotations, two versions
      - lyrics
    content: 40 solo monophonic singing excerpts, 7 languages, mixed recording devices incl. phones
    files: []          # filled at fetch: path, sha256, sample_rate, channels, bit_depth, duration
    preprocessing:
      resample_to_hz: 32000        # the watch's default rate (ADR 0003); a 48000 variant exists only if
                                   # experiment 0001 clause 4 PASSES, i.e. only if threshold T3 does NOT
                                   # fire. T3 is the failure branch: roadmap line "T3 | Mic clocks at
                                   # 3.072 MHz ... | fails or is marginal | Cap at 32 kHz / DSR_8S", and
                                   # ADR 0003 decision 5 agrees. Corrected 2026-08-21 (was "if T3 passes")
      resampler: soxr VHQ via python-scripts (recorded with its version)
      level_normalisation: ITU-T P.56 active speech level, target recorded per run
      channels: mono (already mono; assert at fetch)
    use:
      - row: "RPA @ 50 / 25 / 10 cents; median |Δcents| vs Praat"
        path: injection
      - row: "RPA, acoustic path (subset, replayed through the monitor)"
        path: acoustic
    use_note: >-
      The phone-recorded subset is the closest existing analogue to a wrist MEMS
      capture, which is why this is the primary f0 corpus rather than a studio one.
      NO annotation floor is published for its f0, and the claim that one exists was
      withdrawn on 2026-08-21. Bittner et al. 2021 (bibliography 05 #58, filed at
      docs/papers/by-topic/mir-evaluation-datasets/bittner2021_vocadito.pdf) says
      verbatim of the f0 layer: "One annotator created f0 annotations in this manner
      for each of the 40 tracks", and the paper reports no inter-annotator agreement
      statistic of any kind. The TWO annotators are on the *note* layer only ("In
      order to explore the subjectivity of creating note events for vocals, two
      different annotators created separate note event annotations"), so the two note
      versions bound note segmentation and note pitch -- NOT the frame-level f0 floor.
      The annotation floor on any cents claim from this corpus is therefore TBD: it
      would take an agreement study (a second f0 annotator over a subset) or a corpus
      whose f0 is instrumented rather than annotated (PTDB-TUG laryngograph, 10 #10;
      the Dagstuhl larynx contact mic) to set one. Owner: the D6 validation freeze.
      bibliography 10 #1 carries the same withdrawn sentence and needs the same edit.
    clinical_claim: "no"   # quoted: bare no is a YAML 1.1 boolean. ADR 0005 rule 4: audio may be used, labels are never targets
    restrictions:
      flags: []
      consequence: none — usable in headline metrics

