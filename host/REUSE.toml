#
# ADR 0004 item 2 says every file under host/ carries the GPL identifier, so
# that the licence boundary is one grep. Some files here cannot carry a comment:
# uv.lock is generated and merge=binary, .python-version is a bare version
# string, and golden outputs are .npy. REUSE 3.3's annotation mechanism covers
# them without inventing a sidecar convention.
#
# `reuse lint` is a manual-stage pre-commit hook (.pre-commit-config.yaml); it
# stays manual until the Markdown library is annotated repo-wide.
version = 1

[[annotations]]
path = ["uv.lock", ".python-version"]
SPDX-FileCopyrightText = "2026 Alexander Gomez"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["golden/outputs/**"]
SPDX-FileCopyrightText = "2026 Alexander Gomez"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The web application's front end (ADR 0021 decision 4, roadmap W0). The .ts,
# .css and .html files carry the identifier in their own comment syntax and are
# checked by the `spdx-header` pre-commit hook; these four cannot. JSON has no
# comment syntax (package.json's own `"license"` field is npm metadata, not an
# SPDX header, and neither the hook nor `reuse lint` reads it), .nvmrc is a bare
# version string, and package-lock.json is generated by `npm install
# --package-lock-only` -- a header written into it would not survive the next
# regeneration. Listed by name rather than as `web/**` so that a new
# uncommentable file has to be argued for here instead of inheriting a licence
# from a glob.
[[annotations]]
path = ["web/package.json", "web/package-lock.json", "web/tsconfig.json", "web/.nvmrc"]
SPDX-FileCopyrightText = "2026 Alexander Gomez"
SPDX-License-Identifier = "GPL-3.0-or-later"
