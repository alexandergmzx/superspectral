#
# The Linux companion (ADR 0002). GPL-3.0-or-later, not Apache-2.0, because it
# imports parselmouth in-process; the licence boundary is this directory
# (ADR 0004). Nothing outside host/ imports anything in host/, and nothing here
# imports the Apache tooling — the halves exchange files on disk only.
#
# praat-parselmouth is pinned EXACTLY, not with `~=`, because the pin IS the
# Praat version: 0.4.0 through 0.4.7 all bundle Praat 6.1.38 (2021-01-02), which
# registers `To Pitch (ac)`/`(cc)` and NOT `To Pitch (filtered autocorrelation)`
# (that arrived in Praat 6.4, 2023-11-15). A silent bump to a future 0.5.x would
# change the default pitch method underneath every golden file — exactly the
# drift ADR 0009's verify step exists to catch, so the lock refuses it instead.

[project]
name = "superspectral-host"
version = "0.1.0"
description = "Super Spectral — Linux companion: offline analysis and Praat golden-file generation"
requires-python = ">=3.11,<3.14"
license = "GPL-3.0-or-later"
dependencies = [
  "praat-parselmouth==0.4.7",
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "pyyaml>=6.0,<7",
  "jsonschema>=4.10,<5",
  # The web application's backend (ADR 0021 decision 1, roadmap W0). CORE, not
  # an extra: the backend is what serves the interface at all, and `spectral-web
  # serve` with no extras installed must start and answer /api/presets — the
  # byte-identity gate of W0 runs against it.
  "fastapi>=0.115,<1",
  # PLAIN uvicorn, never uvicorn[standard]. The `standard` extra pulls in
  # `websockets` (plus uvloop, httptools, watchfiles), and ADR 0002 decision 4
  # as amended by ADR 0021 decision 5 is "no live link between watch and host":
  # no transport of audio or spectra exists in v1, so a WebSocket implementation
  # on the server is a capability with no caller and an attack surface with no
  # justification. Leaving it out makes the absence checkable (`import
  # websockets` fails in the locked environment) rather than merely intended.
  "uvicorn>=0.30,<1",
  # Multipart form parsing for the WAV upload of the offline-compare mode.
  # FastAPI raises at import of a route declaring `UploadFile` without it, so it
  # is a hard dependency of the shape of the API rather than of W0's endpoints.
  "python-multipart>=0.0.9,<1",
  # Explicit, though FastAPI depends on it: `spectral_host.web.models` imports
  # pydantic directly, and a direct import is a direct pin (a transitive bump
  # under FastAPI must not silently change our response models).
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
# httpx is the TestClient's transport: `fastapi.testclient.TestClient` wraps
# `httpx.Client`, so the web suite cannot collect without it. It is test-only —
# nothing under src/ imports httpx.
dev = ["pytest>=8", "httpx>=0.27,<1"]
# `spectral-web peak` live mode. PortAudio bindings; the WAV mode needs nothing.
capture = ["sounddevice>=0.5,<1"]
# `analyze` (librosa) and `separate` (demucs + torch) land at W4, NOT here:
# adding hundreds of megabytes to uv.lock for code that does not exist would
# churn the lock and make every W0 CI run pay for W4. Until then `/analyze` and
# `/separate` answer 501 through `spectral_host.web.extras`, and that 501 path
# is what CI exercises (ADR 0021 consequence: "/separate is exercised through
# its 501 path in CI").

[project.scripts]
# The one entry point. Subcommands: verify | env | generate | t7 (roadmap H0,
# units B-U5/B-U4/B-U6/B-U10); a subcommand exits 2 with "not implemented"
# until its unit lands (t7 as of 2026-08-22 — experiment 0005 is the owner's
# to run), so a half-built environment is loud rather than silently green.
spectral-golden = "spectral_host.golden.cli:main"

# The web application's entry point (ADR 0021 decision 1, roadmap W0).
# Subcommands: serve | peak. `peak` is the founding research document's M0
# peak-frequency printer; `serve` runs the FastAPI application under uvicorn,
# with --ssl-certfile / --ssl-keyfile for phone-on-LAN (ADR 0021 decision 8).
spectral-web = "spectral_host.web.cli:main"

# src layout, same backend as python-scripts/doc_ocr. The package lives in
# host/src/spectral_host/ so that `import spectral_host` only works from an
# installed environment (host/.venv) and never by accident from a checkout with
# host/ on sys.path — which is how a GPL import would leak into Apache code.
#
# setuptools >= 77, not 68: the `license = "GPL-3.0-or-later"` SPDX-string form
# above is PEP 639 (setuptools 77.0.0, 2025-03); older setuptools reject a
# string there as invalid metadata. Build-time only; no runtime dependency.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Run from host/ (`uv run pytest`) or from the repository root
# (`uv run --project host pytest -q host/tests`): both resolve here.
testpaths = ["tests"]
