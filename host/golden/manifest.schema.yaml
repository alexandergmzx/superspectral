# SPDX-FileCopyrightText: 2026 Alexander Gomez
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Golden-file manifest schema — JSON Schema draft 2020-12, written in YAML.
#
# WHAT THIS IS
#   The machine-checkable form of the rule stated in ADR 0009 and specified in
#   ../../docs/validation/golden-files.md: *a golden file is its manifest*. A
#   `.npy` of f0 values is worthless without the provenance that says which
#   parselmouth, which BUNDLED Praat, which pitch method, which floor/ceiling
#   and which input bytes produced it. This schema is what `verify.py` loads
#   before it trusts a single number.
#
# WHY IT LIVES HERE, UNDER THE GPL BOUNDARY
#   ADR 0004 makes `host/` GPL-3.0-or-later as a *directory*, with no per-file
#   exceptions, so that the boundary is one `grep`. This file therefore carries
#   the directory's SPDX tag like every other text file under `host/`. It is
#   *consumed as data* by the Apache-2.0 test harness in ../../host-tests/ —
#   reading a file is not linking, which is the whole reason the contract
#   between the two halves is a file format and not an API (ADR 0002).
#
# WHERE THE LIMITS ARE *NOT*
#   No tolerance appears in this schema. Tolerances live in exactly one place,
#   ../../docs/validation/golden-files.md, on the Apache side; the manifest only
#   *points* at that table (`tolerances.source`) and records which revision of
#   it a vector set was accepted against (`tolerances.revision`). A generator
#   that could define its own acceptance limit would be marking its own homework.
#
# LICENCE NOTE ON THE DATA ITSELF
#   The SPDX tag above is directory hygiene, not a claim that a float array of
#   measurements computed from our own input WAVs is a derivative work of Praat.
#   See ADR 0009 §Decision item 3.
#
# HOW TO USE IT
#   python3 -c "import yaml; yaml.safe_load(open('manifest.schema.yaml'))"
#   python3 -c "import json,yaml,jsonschema; \
#       jsonschema.Draft202012Validator(yaml.safe_load(open('manifest.schema.yaml'))) \
#       .validate(yaml.safe_load(open('manifest.yaml')))"
#
# WHAT THIS SCHEMA CANNOT EXPRESS (enforced by `verify.py`, not by JSON Schema)
#   1. `analyses.pitch.pitch_floor` < `analyses.pitch.pitch_ceiling`.
#   2. Every `outputs[].input` value appears as some `inputs[].path`.
#   3. Every `outputs[].analysis` value names a key present in `analyses`.
#   4. Every recorded sha256 matches the bytes actually on disk.
#   5. `generator.parselmouth` / `generator.praat_bundled` match the *installed*
#      environment at verification time (drift here means regenerate, not patch).
#   6. `analyses.pitch.method: filtered` requires `generator.praat_bundled`
#      >= 6.4.0, compared as a version tuple (ADR 0009 amendment, 2026-08-21).
#   7. Every `windows[].sha256` is RECOMPUTED from `windows[].coefficients`
#      (periodic window, N float32 little-endian samples, see `windows`) and
#      must match; and `windows[].coefficients` equal, term for term, the
#      preset-schema §4.3 table for the named family (`rect` = [1.0]). A digest
#      that validates but does not recompute is exactly the window drift
#      ADR 0006 D1 exists to catch. (schema "1.1")
#   8. An entry of `windows[]` exists for the pair
#      (`analyses.spectrum.window`, `analyses.spectrum.window_length_samples`)
#      whenever `analyses.spectrum` is present. (schema "1.1")
#   A manifest that passes this schema and fails any of 1–8 is not a golden set.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:super-spectral:schema:golden-manifest:1.1"
title: Super Spectral golden-file manifest
description: >-
  One manifest per golden set (`tier0-synthetic`, `vocadito-subset`, …). Describes
  the exact environment, the exact settings and the exact bytes behind every
  reference vector the watch's DSP is regressed against. Structure follows the
  specification in docs/validation/golden-files.md; a set whose manifest is
  missing any required field is rejected by the harness, never silently defaulted.

type: object
additionalProperties: false
required:
  - schema
  - set
  - generated
  - generator
  - inputs
  - analyses
  - outputs
  - tolerances
  - regeneration

properties:

  schema:
    description: >-
      Manifest schema version, a QUOTED "MAJOR.MINOR" string, bumped only by an
      ADR amendment. MINOR (1 -> "1.1") means fields were ADDED and every
      existing pin is untouched: a set keeps its name, and its manifest is
      re-emitted with a `regeneration.reason` that names the schema (e.g.
      "re-emitted for golden-manifest schema 1.1; no pin changed"). MAJOR means
      a pin moved or a field changed meaning: every set is regenerated under a
      NEW name (ADR 0009 decision 4). A reader accepts exactly ONE value, this
      `const`, and refuses everything else rather than guessing — no range, no
      "at least", and no integer form: the schema-1 integer `1` is rejected by
      design, because a manifest written before `windows[]` existed cannot
      carry the digest this version requires. "1.1" adds `windows[]` (the
      ADR 0006 D1 window-table digest; ADR 0009 amendment of 2026-08-21). The
      `filtered` pitch-method bump ADR 0009 promises (a pitch TOP plus an
      `attenuation at top` in place of `pitch_ceiling`) becomes "1.2".
    type: string
    const: "1.1"

  set:
    description: >-
      Name of the golden set. One manifest per set, and the name is also the
      output directory (`outputs/<set>/`). Changing a pin (parselmouth, bundled
      Praat, method, floor/ceiling) produces a NEW set with a new name — golden
      sets are never edited in place (ADR 0009 §Decision item 4).
    type: string
    pattern: "^[a-z0-9][a-z0-9-]*$"

  generated:
    description: UTC date the generator wrote this manifest (YYYY-MM-DD).
    $ref: "#/$defs/date"

  generator:
    description: >-
      The environment that produced the vectors. This block is the reason the
      manifest exists: "parselmouth is numerically identical to Praat" holds only
      within one bundled Praat version, and Praat changed its default pitch
      method from raw to filtered autocorrelation in 2023.
    type: object
    additionalProperties: false
    required:
      - script
      - sha256
      - commit
      - python
      - numpy
      - scipy
      - parselmouth
      - praat_bundled
      - praat_reference
      - platform
      - blas
    properties:
      script:
        description: >-
          Repository-relative path of the generator PACKAGE: `host/src/spectral_host`
          (the only value verify.py accepts, since 2026-08-22). The generator
          is a package — the spectrum oracle, the Praat wrappers, the decoder,
          the set definitions and the driver — not one script; the pre-src-
          layout example `host/golden/generate.py` is retired.
        type: string
        minLength: 1
      sha256:
        description: >-
          The sorted tree hash of the NUMERICS-BEARING modules of the package,
          so that a change to anything that can alter a vector is visible in
          the manifest diff even when the outputs happen not to move. The module
          list is `spectral_host.env.GENERATOR_TREE` (env.py, hashing.py,
          praat.py, spectrum.py, wavio.py, golden/sets.py, golden/generate.py);
          the recipe is `spectral_host.hashing.sha256_files`: sort the POSIX
          relative paths and feed ONE sha256, per file, `relpath + NUL + str(size)
          + NUL + bytes`. Modules that cannot change a vector (cli.py, verify.py,
          manifest.py, presets.py) are deliberately outside the list, so editing
          them never turns a committed set red; editing a listed module always
          does — verify.py invariant I4 — and the answer is a regeneration with a
          stated reason, never a patched digest (ADR 0009 decision 4).
        $ref: "#/$defs/sha256"
      commit:
        description: Full 40-hex repository commit the generator ran from.
        $ref: "#/$defs/git_sha"
      python:
        description: "`python3 --version` of the interpreter that ran the generator, e.g. `3.12.3`."
        $ref: "#/$defs/version"
      numpy:
        description: "`numpy.__version__`. Fixes array dtype/reduction behaviour and the .npy format."
        $ref: "#/$defs/version"
      scipy:
        description: >-
          `scipy.__version__`. Load-bearing for the `spectrum` analysis block:
          `scipy.signal.get_window` is periodic (`fftbins=True`) while
          `scipy.signal.windows.<name>` defaults to symmetric.
        $ref: "#/$defs/version"
      parselmouth:
        description: "`parselmouth.__version__` — the installed praat-parselmouth PyPI version."
        $ref: "#/$defs/version"
      praat_bundled:
        description: >-
          `parselmouth.PRAAT_VERSION` — the Praat version parselmouth EMBEDS.
          Never assumed equal to the current praat.org release. This, not
          `praat_reference`, is the version the numbers came from.
        $ref: "#/$defs/version"
      praat_reference:
        description: >-
          The praat.org Praat release the side-by-side comparison of roadmap
          threshold T7b was run against (praat.org is at 7.0.01, read 2026-08-21).
          May be `null` ONLY while T7b is open — T7a (which Praat parselmouth
          bundles) is closed; a set carrying `null` here may not back a "vs Praat"
          claim outside the project.
        type:
          - string
          - "null"
      platform:
        description: "Host platform string (`uname -srm` or `platform.platform()`)."
        type: string
        minLength: 1
      blas:
        description: >-
          NumPy's BLAS/LAPACK vendor and version (`numpy.show_config()`). Recorded
          because reduction order — and therefore the last bits — differs between
          vendors; the tolerance table absorbs it, but only if it is visible.
        type: string
        minLength: 1

  inputs:
    description: >-
      Every input WAV, identified by the sha256 of its bytes AS USED (computed
      after any resampling). Inputs are not stored in this directory: Tier-0
      signals are regenerated by their Apache-2.0 generators under
      python-scripts/, corpus excerpts are fetched through datasets/ manifests.
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [path, sha256, sample_rate, bit_depth, channels, source]
      properties:
        path:
          description: Repository-relative path of the WAV as consumed by the generator.
          type: string
          minLength: 1
        sha256:
          description: sha256 of the file's bytes after any preprocessing recorded below.
          $ref: "#/$defs/sha256"
        sample_rate:
          description: >-
            Sample rate in Hz of the file as used. Recorded per input because
            published accuracy figures are rate-specific (CREPE's are at 16 kHz)
            and a silent resample is the classic false accuracy gap.
          type: integer
          minimum: 1
        bit_depth:
          description: Bits per sample of the stored WAV.
          type: integer
          enum: [16, 24, 32]
        channels:
          description: Channel count. The watch path is mono; a stereo input must say how it was mixed in `preprocessing`.
          type: integer
          minimum: 1
        duration_s:
          description: Duration in seconds. Optional, informational.
          type: number
          exclusiveMinimum: 0
        source:
          description: Provenance of the input — where it came from and under what terms.
          type: object
          additionalProperties: false
          required: [kind, name]
          properties:
            kind:
              description: >-
                `tier0-synthetic` = generated in-repo, exact by construction;
                `corpus` = an external dataset excerpt; `recorded` = captured by
                this project.
              type: string
              enum: ["tier0-synthetic", "corpus", "recorded"]
            name:
              description: Generator name (Tier 0) or corpus name, matching datasets/corpora/manifest.yaml.
              type: string
              minLength: 1
            parameters:
              description: >-
                Free-form map of the generator's parameters (frequency, level,
                window, seed). Required in practice for `tier0-synthetic` if the
                signal is to be reproducible; free-form because generators differ.
              type: object
            licence:
              description: SPDX identifier or licence name for a `corpus` input; omitted for Tier 0.
              type: string
        preprocessing:
          description: >-
            What was done to the file before the sha256 above was taken. Absent
            means "the bytes are as published/generated".
          type: object
          additionalProperties: false
          properties:
            resample_to_hz:
              type: integer
              minimum: 1
            resampler:
              description: Resampler and quality setting (e.g. `soxr VHQ`).
              type: string
            resampler_version:
              $ref: "#/$defs/version"
            level_normalisation:
              description: e.g. `ITU-T P.56 active speech level, -26 dBov` or `none`.
              type: string
            channel_mixdown:
              description: How multi-channel material was reduced to mono.
              type: string

  analyses:
    description: >-
      One block per analysis kind this set contains. `pitch`, `formant`,
      `spectrogram` and `ltas` are Praat's, run through parselmouth; `spectrum`
      is the NumPy/SciPy reference behind the window-coefficient and
      magnitude-spectrum rows of the tolerance table. Every field of a block that
      is present is required — Praat's defaults differ between the raw and
      filtered pitch methods, so "left at the default" is not a record of anything.
    type: object
    additionalProperties: false
    minProperties: 1
    properties:

      pitch:
        description: Parameters of Praat's pitch analysis.
        type: object
        additionalProperties: false
        required:
          - method
          - time_step
          - pitch_floor
          - pitch_ceiling
          - silence_threshold
          - voicing_threshold
          - octave_cost
          - octave_jump_cost
          - voiced_unvoiced_cost
          - max_candidates
          - very_accurate
        properties:
          method:
            description: >-
              `raw` = `To Pitch (ac)...` on the pinned Praat 6.1.38 (the classic
              autocorrelation of Boersma 1993) — that is the command name a
              generator must actually call; `To Pitch (raw ac)...` and
              `To Pitch (raw autocorrelation)...` are Praat 6.4+ synonyms for the
              same `Sound_to_Pitch_rawAc()` entry point and raise `Command "..."
              not available for given objects.` on 6.1.38 (measured with
              parselmouth 0.4.7, 2026-08-21). The 6.4 form also reorders the
              dialogue arguments (floor and ceiling adjacent), so a positional
              `praat.call` is not portable across that boundary. `filtered` =
              `To Pitch (filtered autocorrelation)...` (Praat's default since 6.4,
              2023-11-15); `cc` = cross-correlation, only where a set explicitly
              needs it. There is no default: state it.

              `filtered` is admitted by this enum but is NOT REACHABLE from any
              released praat-parselmouth: 0.4.0 through 0.4.7 all bundle Praat
              6.1.38 (2021-01-02), which raises `PraatError: Command "To Pitch
              (filtered autocorrelation)" not available for given objects.`
              (measured 2026-08-21). `verify.py` invariant 6 therefore rejects
              `filtered` unless `generator.praat_bundled >= 6.4.0`. Two further
              things a `filtered` set will need, so they are written down now:
              the filtered method takes a pitch TOP plus an `attenuation at top`
              rather than the `pitch_ceiling` below, so admitting it is a schema
              MINOR BUMP, not just an enum value; and its defaults differ in
              every threshold (silence 0.09, voicing 0.50, octave cost 0.055,
              floor 50 / top 800).
            type: string
            enum: ["raw", "filtered", "cc"]
          time_step:
            description: >-
              Analysis step in seconds. `0` means Praat's automatic step; explicit
              is preferred so the hop relates to the watch's frame rate. Frames
              are compared by TIME, never by index — Praat centres its grid
              (`t1 = (duration - (nFrames-1)*dt)/2`) and the device frames from
              sample 0.
            type: number
            minimum: 0
          pitch_floor:
            description: Praat pitch floor in Hz. Changing it is a new golden set, not an edit.
            type: number
            exclusiveMinimum: 0
          pitch_ceiling:
            description: Praat pitch ceiling in Hz. Must exceed `pitch_floor` (checked by verify.py).
            type: number
            exclusiveMinimum: 0
          silence_threshold:
            type: number
            minimum: 0
          voicing_threshold:
            type: number
            minimum: 0
          octave_cost:
            type: number
            minimum: 0
          octave_jump_cost:
            type: number
            minimum: 0
          voiced_unvoiced_cost:
            type: number
            minimum: 0
          max_candidates:
            description: Praat's maximum number of pitch candidates per frame.
            type: integer
            minimum: 2
          very_accurate:
            description: Praat's "very accurate" flag (longer window, slower).
            type: boolean

      formant:
        description: >-
          Parameters of Praat's formant analysis. Praat's Burg analysis fits
          `2 x max_formants` poles — there is no `+2`. `Sound_to_Formant_burg()`
          calls `Sound_to_Formant_any (me, dt, Melder_iround (2.0 * nFormants), ...)`
          in `fon/Sound_to_Formant.cpp`, identically at tag `v6.1.38` (the Praat
          parselmouth bundles) and at `v6.4.27`; the manual page `Sound: To Formant
          (burg)...` states it in prose ("the number of 'poles' ... is twice the
          Maximum number of formants"). So `max_formants: 5` is LPC order 10, not 12
          — a device-side LPC built at 12 would silently invalidate the F1/F2 row of
          the tolerance table.
        type: object
        additionalProperties: false
        required: [method, time_step, max_formants, ceiling_hz, window_length, preemphasis_from_hz]
        properties:
          method:
            type: string
            enum: ["burg"]
          time_step:
            type: number
            minimum: 0
          max_formants:
            description: >-
              Praat's "maximum number of formants" (often 5). The device-side LPC
              order that matches it is `2 x max_formants` (10 for 5); see the block
              description above. May be a multiple of 0.5, which is why it is a
              number and not an integer — Praat rounds `2 x max_formants` to the
              nearest whole pole count.
            type: number
            exclusiveMinimum: 0
          ceiling_hz:
            description: >-
              Praat's formant ceiling in Hz. The single most outcome-changing
              formant setting; a comparison against a device estimate is
              meaningless unless the device used the same LPC order and ceiling.
            type: number
            exclusiveMinimum: 0
          window_length:
            description: Analysis window length in seconds.
            type: number
            exclusiveMinimum: 0
          preemphasis_from_hz:
            type: number
            minimum: 0

      spectrogram:
        description: Parameters of Praat's `To Spectrogram`.
        type: object
        additionalProperties: false
        required: [window_shape, window_length, time_step, frequency_step, max_frequency]
        properties:
          window_shape:
            description: >-
              Praat's window-shape enumeration. For `gaussian`, Praat's effective
              bandwidth is 1.2982804 / window_length — a Praat-specific relation
              that does NOT match the esp-dsp window set, which is why spectrogram
              vectors are compared as levels and not as coefficients.
            type: string
            enum: ["square", "hamming", "bartlett", "welch", "hanning", "gaussian"]
          window_length:
            description: Window length in seconds (0.005 ≈ 260 Hz wideband; 0.030 ≈ 43 Hz narrowband).
            type: number
            exclusiveMinimum: 0
          time_step:
            type: number
            exclusiveMinimum: 0
          frequency_step:
            type: number
            exclusiveMinimum: 0
          max_frequency:
            type: number
            exclusiveMinimum: 0

      ltas:
        description: Parameters of Praat's `To Ltas`.
        type: object
        additionalProperties: false
        required: [bandwidth_hz]
        properties:
          bandwidth_hz:
            type: number
            exclusiveMinimum: 0

      spectrum:
        description: >-
          The NumPy/SciPy reference for the window-coefficient and per-bin
          magnitude rows of the tolerance table. Every field here is one of the
          documented silent-mismatch traps: periodic vs symmetric windows, FFT
          normalisation, the dBFS reference, int16 scaling and accumulation width.
          Pinning them is what makes a dB difference a finding instead of a fudge
          factor.
        type: object
        additionalProperties: false
        required:
          - window
          - window_length_samples
          - fftbins
          - fft_size
          - normalization
          - scaling
          - dbfs_reference
          - int16_scale
          - dtype
        properties:
          window:
            description: >-
              The window FAMILY the reference was built with — a preset-schema
              §4.3 name (or `rect`, calibration tones only; see
              `$defs/window_family`), never a SciPy name. The window is built
              from the family's COEFFICIENTS with
              `scipy.signal.windows.general_cosine(N, a, sym=False)`, not from
              `scipy.signal.get_window(<name>, N)`: the name-based oracle is
              wrong for one of the six families — SciPy's `nuttall` IS this
              list's `blackman_nuttall`, and this list's `nuttall` has no SciPy
              name at all (max |Δ| 0.0163; ADR 0006 D1, measured 2026-08-21).
              The `windows[]` entry for (this, `window_length_samples`) carries
              the coefficients and the digest — invariant 8 of verify.py. Schema 1
              said "as passed to scipy.signal.get_window"; "1.1" corrects it.
            $ref: "#/$defs/window_family"
          window_length_samples:
            type: integer
            minimum: 2
          fftbins:
            description: >-
              `True` = periodic (`get_window(..., fftbins=True)`), `False` =
              symmetric (`windows.<name>(N, sym=True)`). The two differ by one
              sample of phase and by a fraction of a dB per bin, worst at small N.
              There is no defensible default; state it.
            type: boolean
          fft_size:
            description: FFT length in samples (zero-padded if larger than the window).
            type: integer
            minimum: 2
          normalization:
            description: >-
              The scale factor applied to the DFT output before magnitudes are
              taken. Must match the single convention fixed by ADR 0006 for both
              halves of the project.
            type: string
            enum: ["none", "1/N", "1/sqrt(N)", "coherent_gain", "S1", "S2"]
          scaling:
            description: >-
              What the stored array represents (Heinzel 2002 vocabulary): a power
              spectrum, a power spectral density, a linear spectrum or a linear
              spectral density. A sine reads correctly under one and the noise
              floor under another; both are only right when this is stated.
            type: string
            enum: ["power_spectrum", "power_spectral_density", "linear_spectrum", "linear_spectral_density"]
          dbfs_reference:
            description: >-
              `sine` = a full-scale SINE is 0 dBFS (the project's convention);
              `square` = a full-scale square is 0 dBFS, which puts a full-scale
              sine at -3.01 dBFS. The classic constant 3 dB offset lives here.
            type: string
            enum: ["sine", "square"]
          int16_scale:
            description: >-
              Divisor used to convert int16 PCM to float. 32768 is the project's
              convention (and Praat's); 32767 differs by 0.00026 dB, invisible
              until a clipping test at exactly full scale disagrees on the flag.
            type: integer
            enum: [32768, 32767]
          dtype:
            description: >-
              Accumulation width used to compute the reference. The host is
              float64 and the watch is float32; that asymmetry is deliberate and
              is what the tolerance table exists to bound.
            type: string
            enum: ["float32", "float64"]

  windows:
    description: >-
      The window-table digests of ADR 0006 D1 (schema "1.1"): one entry per
      (family, N) the set's spectrum references were built with, so that a
      window that quietly changes shape fails `verify` instead of shifting every
      level by a fraction of a dB. Each entry records the coefficients the
      window was BUILT FROM — never a library's name for it, which is the 0.0163
      trap ADR 0006 D1 measured — and the sha256 over the N float32
      LITTLE-ENDIAN samples of the PERIODIC window, i.e.
      `hashlib.sha256(np.asarray(w, dtype="<f4").tobytes()).hexdigest()` where
      `w = scipy.signal.windows.general_cosine(N, a, sym=False)` on the host and
      the float32 table `spectral_window_fill()` leaves in memory on the
      device (dumped raw and hashed off-device; the C side carries no sha256).
      Float32 is the hashed representation on purpose: the device stores
      float32, and rounding the host's float64 `cos()` to float32 discards the
      last-ULP libm differences between x86 hosts that would otherwise make the
      digest platform-dependent. The residual — a sample that lands within one
      float64 ULP of a float32 rounding boundary — has not been observed:
      measured 2026-08-21 over all seven families at N = 512 … 16384, the
      closest approach is 1521 float64 ULP (`nuttall`, N = 2048), so a
      last-ULP libm difference cannot flip a digest. If it ever is observed on
      a new (family, N), it is a red `verify` and
      a finding, never a widened tolerance, because the tolerance row for this
      digest (docs/validation/golden-files.md) is "exact". REQUIRED whenever
      `analyses.spectrum` is present (root-level `if`/`then` below, the same
      construction protocols/specs/presets.schema.json uses); permitted
      otherwise, so a set may carry the digests of every family at the sizes it
      generates. What the schema cannot check, `verify.py` does: invariant 7 —
      every `sha256` is recomputed from `coefficients` and must match, and
      `coefficients` equal the preset-schema §4.3 table for `family`, term for
      term (`rect` = [1.0]); invariant 8 — an entry exists for the pair
      (`analyses.spectrum.window`, `analyses.spectrum.window_length_samples`).
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [family, n, coefficients, sha256]
      properties:
        family:
          description: >-
            Window family this table was built for. `rect` is admitted here and
            nowhere else — see `$defs/window_family`.
          $ref: "#/$defs/window_family"
        n:
          description: >-
            Window length N in samples — the period of the periodic cosine sum
            and the number of float32 samples hashed. Matches
            `analyses.spectrum.window_length_samples` for the entry invariant 8
            looks up.
          type: integer
          minimum: 2
        coefficients:
          description: >-
            The cosine-sum a_k, a_0 first, exactly as in preset-schema §4.3:
            `w[j] = Σ_k (−1)^k · a_k · cos(2πkj/N)`, j = 0 … N−1. One term for
            `rect` ([1.0]), two for `hann`, up to five for `flat_top`. Recorded
            so the digest can be recomputed without consulting any table, and
            checked against that table by invariant 7 so the two cannot drift.
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: number
        sha256:
          description: >-
            sha256 of the N float32 little-endian samples of the periodic window
            built from `coefficients`, as defined in the `windows` description.
          $ref: "#/$defs/sha256"

  outputs:
    description: >-
      Every array the generator wrote, identified by sha256. `units` and `columns`
      are required because an array of numbers with no unit is the single most
      common way a golden file lies (Hz vs cents, dB vs linear).
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [path, sha256, analysis, input, dtype, shape, units, columns]
      properties:
        path:
          description: Repository-relative path of the written array (e.g. `host/golden/outputs/tier0-synthetic/pitch_sine_440.npy`).
          type: string
          minLength: 1
        sha256:
          $ref: "#/$defs/sha256"
        analysis:
          description: Which `analyses` block produced this array.
          type: string
          enum: ["pitch", "formant", "spectrogram", "ltas", "spectrum"]
        input:
          description: The `inputs[].path` this array was computed from.
          type: string
          minLength: 1
        dtype:
          description: NumPy dtype of the stored array.
          type: string
          enum: ["float32", "float64", "int16", "int32"]
        shape:
          description: Shape of the stored array, most significant axis first.
          type: array
          minItems: 1
          items:
            type: integer
            minimum: 0
        units:
          description: >-
            Physical unit per column, in order, as a single human-readable string
            (e.g. `s, Hz` or `Hz, dB re full-scale sine`).
          type: string
          minLength: 1
        columns:
          description: Name of each column, in order (e.g. `[time, f0]`).
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        unvoiced_sentinel:
          description: >-
            Value used to mark an unvoiced frame in a pitch track (Praat/parselmouth
            write 0). Required in practice for `analysis: pitch`; omitted elsewhere.
            Never inferred — a 0 that is silently treated as a frequency destroys
            a cents comparison.
          type: number

  tolerances:
    description: >-
      A POINTER to the acceptance limits, never the limits themselves. The
      tolerance table is Apache-licensed, lives on the validation side and is the
      only place a limit is defined (ADR 0009 §Decision item 2).
    type: object
    additionalProperties: false
    required: [source, revision]
    properties:
      source:
        description: Repository-relative path of the tolerance table.
        type: string
        const: "docs/validation/golden-files.md"
      revision:
        description: >-
          The commit sha of the tolerance table this vector set was accepted
          against. Recorded so that a widened tolerance and a regenerated vector
          set can never be confused with each other in review.
        $ref: "#/$defs/git_sha"

  regeneration:
    description: >-
      Regeneration is a deliberate, reviewed act with a recorded reason — never a
      silent refresh. This block is written on EVERY generation, including the
      first (`reason: initial generation`, previous fields `null`).
    type: object
    additionalProperties: false
    required: [date, reason, approved_by, previous_manifest_sha256, previous_set]
    properties:
      date:
        $ref: "#/$defs/date"
      reason:
        description: >-
          Why the vectors were regenerated, in prose a reviewer can disagree with.
          "Tests were failing" is not a reason; "parselmouth 0.x.y bundles Praat
          a.b.c, whose filtered-autocorrelation default changes the f0 track" is.
        type: string
        minLength: 1
      approved_by:
        description: The human who reviewed the manifest diff and accepted the new set.
        type: string
        minLength: 1
      previous_manifest_sha256:
        description: sha256 of the manifest this set replaces; `null` for the first generation.
        oneOf:
          - $ref: "#/$defs/sha256"
          - type: "null"
      previous_set:
        description: >-
          Name of the set this one supersedes; `null` for the first generation.
          A pin change makes a NEW set — the old one stays on disk until its last
          consumer is retired, so a regression can be bisected against it.
        oneOf:
          - type: string
            pattern: "^[a-z0-9][a-z0-9-]*$"
          - type: "null"

  notes:
    description: Free-form notes for the reviewer. Never load-bearing.
    type: string

# `windows[]` is mandatory exactly when the set carries a spectrum reference:
# the digest is what makes the window and magnitude rows of the tolerance table
# mean anything (ADR 0006 D1). Root-level `if`/`then`, the construction
# protocols/specs/presets.schema.json uses for its conditional rules.
if:
  required: [analyses]
  properties:
    analyses:
      required: [spectrum]
then:
  required: [windows]

$defs:

  sha256:
    description: Lowercase hex sha256 digest, 64 characters.
    type: string
    pattern: "^[0-9a-f]{64}$"

  git_sha:
    description: Full 40-character lowercase hex git object name. Short shas are not accepted.
    type: string
    pattern: "^[0-9a-f]{40}$"

  date:
    description: >-
      Calendar date, YYYY-MM-DD, UTC, written as a QUOTED string. Unquoted, a
      YAML loader resolves it to a native date object and the manifest stops
      being valid JSON — the generator therefore emits `"2026-08-21"`, and
      verify.py rejects a bare date rather than coercing it.
    type: string
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"

  window_family:
    description: >-
      A window family name — the six cosine-sum families of preset-schema §4.3
      that esp-dsp ships and the firmware builds PERIODIC from their
      coefficients (ADR 0006 D1) — plus `rect`. `rect` (a_0 = 1: NENBW 1.000
      bins, S1 = S2 = N, coherent gain 0 dB) is admitted HERE ONLY, for
      calibration tones whose level must read back with no window in the way.
      It is NEVER a preset family: preset-schema §4.3 and presets.schema.json do
      not list it, a preset loader that meets its wire value
      (`SPECTRAL_WINDOW_RECT` = 0) must reject the preset, and admitting it in
      the golden manifest is what closes ADR 0006 consequence (c) with no
      ADR 0010 action. These are NOT SciPy names: SciPy's `nuttall` IS this
      list's `blackman_nuttall`, and this list's `nuttall` has no SciPy name at
      all (ADR 0006 D1, measured 2026-08-21) — build from coefficients, always.
      Shared by `windows[].family` and `analyses.spectrum.window`.
    type: string
    enum: [rect, hann, blackman, blackman_harris, blackman_nuttall, nuttall, flat_top]

  version:
    description: >-
      A version string exactly as the tool reports it. Deliberately not
      regex-constrained: `7.0.01`, `3.12.3` and a git-describe string are all
      legitimate here, and a pattern that rejected one of them would tempt a
      generator into rewriting the value it was supposed to record.
    type: string
    minLength: 1

# ---------------------------------------------------------------------------
# WORKED EXAMPLE — a complete, valid `manifest.yaml` for the `tier0-synthetic`
# set. Angle-bracket placeholders (`<...>`) mark values that are MEASURED at
# generation time, following the convention of docs/validation/golden-files.md:
# a real manifest never contains one. The Praat settings shown are the
# provisional ones from that file; `praat_reference: null` is shown because
# roadmap threshold T7b (bundled Praat vs praat.org 7.0.01) is still open.
#
#   # SPDX-FileCopyrightText: 2026 Alexander Gomez
#   # SPDX-License-Identifier: GPL-3.0-or-later
#   schema: "1.1"
#   set: tier0-synthetic
#   generated: "2026-08-21"
#
#   generator:
#     script: host/golden/generate.py
#     sha256: <64 hex of generate.py>
#     commit: <40 hex repo commit>
#     python: "3.12.3"
#     numpy: <numpy.__version__>
#     scipy: <scipy.__version__>
#     parselmouth: <parselmouth.__version__>
#     praat_bundled: <parselmouth.PRAAT_VERSION>
#     praat_reference: null          # T7b open; no external "vs Praat" claim yet
#     platform: <uname -srm>
#     blas: <numpy.show_config() vendor + version>
#
#   inputs:
#     # 32 kHz first: it is the watch default (ADR 0003) and the rate every
#     # shipped watch preset uses. The 48 kHz twin below is host-only until
#     # experiment 0001 clause 4 passes (ADR 0003 decision 5, threshold T3),
#     # and a golden set that exists ONLY at 48 kHz would never regress the
#     # path the device actually runs.
#     - path: datasets/tier0/sine_440_0dBFS_32k.wav
#       sha256: <64 hex>
#       sample_rate: 32000
#       bit_depth: 16
#       channels: 1
#       duration_s: 3.0
#       source:
#         kind: tier0-synthetic
#         name: sine
#         parameters: {frequency_hz: 440.0, level_dbfs: 0.0, phase_rad: 0.0}
#
#   analyses:
#     pitch:
#       # The two methods do NOT share defaults, which is the whole reason this
#       # block exists. Praat 6.4+ manual, read 2026-08-21:
#       #   filtered: floor 50, top 800, silence 0.09, voicing 0.50, octave 0.055
#       #   raw:      floor 75, ceiling 600, silence 0.03, voicing 0.45, octave 0.01
#       # (both: octave-jump 0.35, voiced/unvoiced 0.14, candidates 15,
#       #  very accurate off, time step 0.0 = auto)
#       #   https://www.fon.hum.uva.nl/praat/manual/pitch_analysis_by_filtered_autocorrelation.html
#       #   https://www.fon.hum.uva.nl/praat/manual/pitch_analysis_by_raw_autocorrelation.html
#       # Below: `raw`, because that is the only method the pinned generator can
#       # run -- praat-parselmouth 0.4.7 bundles Praat 6.1.38, which predates the
#       # filtered method by two years (measured 2026-08-21; see the `method`
#       # description above and ADR 0009's amendment). Only the two fields we
#       # deliberately widen for singing are marked (prov.).
#       method: raw                # the only method Praat 6.1.38 registers; state it, never inherit it
#       time_step: 0.01            # s -- pinned, not Praat's auto 0.0
#       pitch_floor: 65            # Hz (C2); raw default is 75    (prov.)
#       pitch_ceiling: 1100        # Hz (>C6); raw default is 600   (prov.)
#       silence_threshold: 0.03    # raw default
#       voicing_threshold: 0.45    # raw default
#       octave_cost: 0.01          # raw default (per octave)
#       octave_jump_cost: 0.35
#       voiced_unvoiced_cost: 0.14
#       max_candidates: 15
#       very_accurate: false
#     spectrum:
#       window: hann               # a preset-schema §4.3 family, never a SciPy name
#       window_length_samples: 4096
#       fftbins: true              # periodic: general_cosine(N, a, sym=False), ADR 0006 D1
#       fft_size: 4096
#       normalization: "S1"        # per ADR 0006
#       scaling: power_spectrum
#       dbfs_reference: sine       # a full-scale sine is 0 dBFS
#       int16_scale: 32768
#       dtype: float64
#
#   windows:
#     # ADR 0006 D1, schema "1.1": one digest per (family, N) the set uses.
#     # Each is the sha256 of the N float32 little-endian samples of the
#     # PERIODIC window built from `coefficients`. The hann entry is the one
#     # invariant 8 looks up for `analyses.spectrum` above; `rect` is here for
#     # the calibration tone only and can never name a preset window
#     # (ADR 0006 consequence (c)).
#     - family: hann
#       n: 4096
#       coefficients: [0.5, 0.5]
#       sha256: 3ce6c7c870b60fc2425689b96f2ccf1cecff9b071766a48ae3d25a0ca8f3d304   # recomputed, 2026-08-21
#     - family: rect
#       n: 4096
#       coefficients: [1.0]
#       sha256: 3035aac5fb87474c303702f9030301b4e6bb7aee93be3710b8ab8dcea201db70   # = sha256(b'\x00\x00\x80\x3f' * 4096)
#
#   outputs:
#     - path: host/golden/outputs/tier0-synthetic/pitch_sine_440.npy
#       sha256: <64 hex>
#       analysis: pitch
#       input: datasets/tier0/sine_440_0dBFS_32k.wav
#       dtype: float64
#       shape: [296, 2]            # measured: parselmouth 0.4.7 / Praat 6.1.38 on
#                                  #   this exact input gives 296 frames
#                                  #   (t1 = 0.025, dt = 0.01); the count follows
#                                  #   Praat's frame grid, so it moves with
#                                  #   duration, time_step and pitch_floor
#       units: "s, Hz"
#       columns: [time, f0]
#       unvoiced_sentinel: 0
#     - path: host/golden/outputs/tier0-synthetic/spectrum_sine_440.npy
#       sha256: <64 hex>
#       analysis: spectrum
#       input: datasets/tier0/sine_440_0dBFS_32k.wav
#       dtype: float64
#       shape: [2049, 2]
#       units: "Hz, dB re full-scale sine"
#       columns: [frequency, level]
#
#   tolerances:
#     source: docs/validation/golden-files.md
#     revision: <40 hex commit of the tolerance table>
#
#   regeneration:
#     date: "2026-08-21"
#     reason: initial generation
#     approved_by: Alexander Gomez
#     previous_manifest_sha256: null
#     previous_set: null
#
#   notes: >-
#     Shapes depend on the Praat frame grid; compare by time, never by index.
# ---------------------------------------------------------------------------
