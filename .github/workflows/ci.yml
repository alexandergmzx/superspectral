# SPDX-FileCopyrightText: 2026 Alexander Gomez
# SPDX-License-Identifier: Apache-2.0
#
# Super Spectral CI. Phase 0 ("documentation & environment") runs the docs
# and Python jobs, plus the firmware job (enabled in roadmap E1 on
# 2026-08-20, once firmware/twatch-s3/dependencies.lock was committed) — see
# docs/roadmap/documentation-roadmap.md (E1) and ADR 0001.
#
# Third-party actions are pinned to full commit SHAs (the trailing comment is
# the release tag the SHA was resolved from, verified against the GitHub API
# on 2026-08-20). Major tags are repointable, so a bare `@vN` is not a pin.
# To bump: pick the new release tag, resolve it with
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha
# (dereference once more via repos/.../git/tags/<sha> if .object.type is
# "tag"), and update both the SHA and the comment together.

name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # ESP-IDF v6.0.2 (released 2026-06-29; Service to 2027-03-20, EOL 2028-09-20).
  # The multi-arch index digest below was captured 2026-08-20 and MUST be
  # re-derived in roadmap E1 before the firmware job is enabled — tags are
  # repointable, digests age:
  #   docker buildx imagetools inspect espressif/idf:v6.0.2 --format '{{println .Manifest.Digest}}'
  # This is the one place to bump it. Never use `latest` or `release-v6.0`.
  IDF_IMAGE: espressif/idf:v6.0.2@sha256:0d8c9773d48a327233f9c1d7c654ff0bcf133ae24503ea2e97a57cfe02b8cb67
  IDF_TARGET: esp32s3
  FIRMWARE_DIR: firmware/twatch-s3

jobs:

  markdown-lint:
    name: markdown lint (advisory)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1              # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: |
            **/*.md
            !docs/reference-projects/clones/**
            !scratch/**
        continue-on-error: true

  link-check:
    name: relative links resolve (lychee, offline)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1              # v7.0.1
      # Offline mode checks only local file links and heading fragments, which
      # is exactly the repo's cross-linking contract ("relative paths only, so
      # docs work on GitHub and offline"). External URLs are NOT checked here:
      # bibliography links decay on their own schedule and are re-verified in
      # acquisition passes (docs/bibliography/acquisition-status.md), not on
      # every push.
      - name: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8      # v2.9.0
        with:
          args: >-
            --offline
            --no-progress
            --include-fragments
            --exclude-path docs/reference-projects/clones
            --exclude-path scratch
            --root-dir ${{ github.workspace }}
            '**/*.md'
          fail: true

  # The ten `repo: local` hooks in .pre-commit-config.yaml are the project's
  # rules expressed as code: GPIO19/20 (the only recovery path on a sealed
  # board), the twatch_pins.h reserved-name rule, the sdkconfig anti-brick
  # invariants, the partition-table arithmetic, the preset/marker gates, the
  # PDF-redistribution rule (a tracked document must be `redistributable=yes`),
  # and since roadmap H0 (2026-08-21) the golden-regeneration rule (ADR 0009
  # item 4: vectors and the tolerance table never change in one commit) and
  # the licence boundary (ADR 0004: GPL stays inside host/, Apache imports stay
  # out). Until 2026-08-21 they ran ONLY as local git hooks, and `pre-commit
  # install` had never been run — so CLAUDE.md's Never-rule 1, which promises
  # "CI greps for the literals", was describing a second line of defence that
  # did not exist. This job is that line. It runs the local hooks only: the
  # upstream hooks (clang-format, shellcheck, codespell, kconfig) are style and
  # are the developer's business, but these are invariants. golden-regen has no
  # staged set here, so it checks the HEAD commit (its own documented fallback);
  # host-boundary is additionally repeated as four named steps in the `host`
  # job, the way the GPIO19/20 scan below repeats no-usb-pins.
  guard-hooks:
    name: safety hooks (GPIO19/20, sdkconfig, partitions, presets, markers, golden, licence boundary)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1              # v7.0.1
        with:
          # golden-regen diffs HEAD against its parent; at depth 1 the parent is
          # absent and `git diff-tree --root` lists the whole tree (the hook then
          # exits 2 rather than failing the rule falsely). Depth 2 reaches both
          # parents of a merge tip too.
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97          # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pre-commit and the preset validator
        run: python -m pip install --quiet "pre-commit>=3.5" "jsonschema>=4.10"
      # --all-files, not the diff: a rule added after a file was written must
      # still see that file. That is exactly how firmware/idf-gate/ went a day
      # without SPDX headers and how gate_main.c tripped a hook nobody had run.
      # One invocation per hook: `pre-commit run` takes a single hook id, and
      # passing several makes it exit 2 with "unrecognized arguments" -- which
      # looks like a failure but tests nothing. The loop keeps going so one red
      # hook does not hide the others, then fails at the end.
      - name: Run every repo-local guard hook over the whole tree
        run: |
          rc=0
          for h in pdf-redistributable spdx-header no-usb-pins pins-h-usb-reserved-only \
                   sdkconfig-invariants partitions-arithmetic \
                   presets-rules markers-baseline golden-regen host-boundary; do
            echo "::group::$h"
            pre-commit run --all-files "$h" || rc=1
            echo "::endgroup::"
          done
          exit $rc
      # Belt and braces for the one rule whose failure bricks the board: even if
      # the hook definition is ever edited away, this grep stays. It FAILS CLOSED:
      # the only path to "clean" is an explicit "no match" (grep rc 1) on every
      # file. The first version of this step sat under `set -o pipefail` inside
      # an `if`, so a sed or xargs error read as "no match" and printed clean --
      # the failure mode of a guard must never be silence. It also scans .cpp/.hpp
      # and drops comment lines exactly as the hook does, so the two cannot
      # disagree on the same tree.
      - name: GPIO19/20 appear nowhere in firmware sources (independent of the hook)
        shell: bash
        run: |
          set -euo pipefail
          # In a git pathspec `*` also matches `/`, so 'firmware/*.c' is every .c under firmware/.
          git ls-files -z -- 'firmware/*.c' 'firmware/*.h' 'firmware/*.cpp' 'firmware/*.hpp' \
            | tr '\0' '\n' | grep -vE '(^|/)twatch_pins\.h$' > files.lst || true
          if [ ! -s files.lst ]; then
            echo "::error::no firmware sources listed -- the listing broke; refusing to pass"
            exit 1
          fi
          : > matches.lst
          while IFS= read -r f; do
            sed 's/"[^"]*"/""/g' "$f" > blanked.txt            # under set -e a sed failure is fatal
            set +e
            grep -nE 'GPIO_NUM_(19|20)\b|\bGPIO(19|20)\b' blanked.txt \
              | grep -vE '^[0-9]+:[[:space:]]*(/\*|\*|//)' | sed "s|^|$f:|" >> matches.lst
            rcs=("${PIPESTATUS[@]}")
            set -e
            # grep: 0 match / 1 no match / 2 error; the filter grep likewise; sed must be 0.
            if [ "${rcs[0]}" -gt 1 ] || [ "${rcs[1]}" -gt 1 ] || [ "${rcs[2]}" -ne 0 ]; then
              echo "::error::tooling error scanning $f (grep ${rcs[0]}, filter ${rcs[1]}, sed ${rcs[2]})"
              exit 2
            fi
          done < files.lst
          if [ -s matches.lst ]; then
            cat matches.lst
            echo "::error::GPIO19/20 (USB-Serial-JTAG) referenced in firmware sources -- CLAUDE.md Never-rule 1"
            exit 1
          fi
          echo "clean: $(wc -l < files.lst) files scanned, 0 matches"

  python-scripts:
    name: python-scripts compile + tests (doc_ocr, synth_signals, golden_compare) + tier-0 reproducibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1              # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97          # v7.0.0
        with:
          python-version: "3.12"
      # uv 0.11.32 is the version on the development machine (docs/devenv/setup.md
      # section 10, `uv --version` in tools/env-lock.sh); pinned exactly so the
      # resolver that reads the three committed uv.lock files is the one that
      # wrote them. Bump here, on the machine, and in setup.md together.
      - name: Install uv (pinned to the dev machine's version)
        run: python -m pip install --quiet "uv==0.11.32"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9                 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('python-scripts/*/uv.lock', 'host/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      # compileall runs BEFORE any `uv sync` so it never descends into a .venv.
      - name: Syntax-check every Python script
        run: python -m compileall -q python-scripts
      # doc_ocr has no runtime dependencies on purpose (it shells out to
      # poppler/mutool); its tests use captured tool output as fixtures, so
      # they need pytest only. host/ is GPL and has its own environment and
      # its own job (`host`, below); it is not compiled here.
      - name: doc_ocr unit tests
        run: |
          python -m pip install --quiet "pytest>=8"
          cd python-scripts/doc_ocr
          python -m pytest -q
      # The two packages that need NumPy/SciPy/mir_eval each carry their own
      # pyproject.toml + uv.lock + .python-version + .venv (python-scripts/README.md
      # "Environment"): the IDF venv, python-scripts/<pkg>/.venv and host/.venv
      # never mix (ADR 0004). `uv lock --check` first: `--frozen` installs the
      # lock without asking whether it still matches pyproject.toml, so a stale
      # lock would otherwise pass this job silently -- the same reason the
      # firmware job diffs dependencies.lock after the build.
      - name: synth_signals + golden_compare unit tests (own lock each)
        run: |
          rc=0
          for pkg in synth_signals golden_compare; do
            echo "::group::$pkg"
            ( cd "python-scripts/$pkg" \
              && uv lock --check \
              && uv sync --frozen --extra test \
              && uv run pytest -q ) || rc=1
            echo "::endgroup::"
          done
          exit $rc
      # The reproducibility test on a different libm: the tracked
      # datasets/tier0-synthetic/manifest.yaml records the sha256 of every WAV
      # as rendered on the development machine; `check` re-renders each one
      # in memory here and fails on any digest that differs (glibc's cos/sin
      # on the runner vs the developer's, NumPy/SciPy rounding). `generate`
      # rewrites manifest.yaml from its own render, which would make the
      # subsequent `check` compare the runner with itself -- so the tracked
      # manifest is kept aside and put back before `check` runs against it
      # with the freshly written WAVs on disk (a plain copy, not a git
      # command, so the same three lines run unchanged on a developer machine).
      - name: tier-0 synthetic signals regenerate bit-exactly (generate, then check against the tracked manifest)
        run: |
          set -euo pipefail
          cd python-scripts/synth_signals
          m=../../datasets/tier0-synthetic/manifest.yaml
          keep="$(mktemp)"; cp "$m" "$keep"
          uv run python -m synth_signals generate --out ../../datasets/tier0-synthetic
          cp "$keep" "$m"
          uv run python -m synth_signals check --out ../../datasets/tier0-synthetic
      # The presets are a protocol, not configuration: the watch rejects a file
      # that fails any rule in protocols/specs/preset-schema.md section 6, so a
      # rule that quietly stops being true here would ship a preset the device
      # refuses to load. Runs the schema (draft 2020-12) and rules V0-V10 over
      # every shipped preset, plus a negative-case suite that must be rejected.
      # A marker (verify)/(prov.)/unread is a promise to come back. This counts
      # them against a baseline: a correction that comes undone fails, and a new
      # marker without an owner fails. See python-scripts/check_markers.py.
      - name: unresolved-value markers are closed or owned
        run: |
          python python-scripts/check_markers.py --self-test
          python python-scripts/check_markers.py \
            --closed docs/roadmap/markers-closed-2026-08-21.tsv \
            --allow docs/roadmap/markers-allowlist.tsv
      - name: preset schema + loader rules V0-V10
        run: |
          python -m pip install --quiet "jsonschema>=4.10"
          python python-scripts/check_presets.py --verbose

  # The GPL-3.0-or-later half of the licence boundary (ADR 0004), in its own
  # job and its own environment (host/.venv from host/uv.lock): parselmouth is
  # imported in-process here and nowhere else. Runs the host unit tests, then
  # `spectral-golden verify` -- ADR 0009 item 4: recompute every digest, re-read
  # the installed parselmouth / bundled Praat / numpy / scipy, exit 1 on any
  # drift, never regenerate -- and then the boundary itself as four separate
  # failing steps, so the step name says which side leaked.
  host:
    name: host companion (GPL env) - pytest, spectral-golden verify, licence boundary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1              # v7.0.1
        with:
          # Full history: verify rule G1 resolves `tolerances.revision` with
          # `git cat-file -e` and reports "shallow clone" as a skip, not a check;
          # spectral_host.env records `git rev-parse HEAD` as generator.commit.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97          # v7.0.0
        with:
          python-version: "3.12"
      # Same pin as the python-scripts job; see the comment there.
      - name: Install uv (pinned to the dev machine's version)
        run: python -m pip install --quiet "uv==0.11.32"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9                 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('python-scripts/*/uv.lock', 'host/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      # The tier0-synthetic golden set's inputs are the Tier-0 WAVs, which are
      # gitignored (datasets/**/*.wav) and regenerated from the tracked
      # manifest by the Apache-2.0 generator -- the one direction of traffic
      # across the boundary, files on disk. verify rule I4 hashes every input,
      # so they must exist before it runs; the tracked manifest is put back
      # after `generate` for the reason given in the python-scripts job.
      # This is a separate uv project with its own lock (python-scripts/
      # synth_signals/uv.lock); nothing from it is installed into host/.venv.
      - name: Regenerate the Tier-0 WAVs (inputs of the tier0-synthetic golden set)
        run: |
          set -euo pipefail
          cd python-scripts/synth_signals
          m=../../datasets/tier0-synthetic/manifest.yaml
          keep="$(mktemp)"; cp "$m" "$keep"
          uv sync --frozen
          uv run python -m synth_signals generate --out ../../datasets/tier0-synthetic
          cp "$keep" "$m"
      # `uv lock --check` before `--frozen` for the reason given in the
      # python-scripts job. praat-parselmouth==0.4.7 (Praat 6.1.38) is the pin
      # that matters (host/pyproject.toml); a lock that drifted from it would
      # change the default pitch method under every golden file.
      - name: uv sync host/ (frozen, dev extra)
        run: |
          uv lock --check --project host
          uv sync --project host --frozen --extra dev
      - name: host unit tests
        run: uv run --project host pytest -q host/tests
      # Rules S, I1-I8, N1-N4, G1 over every host/golden/outputs/*/manifest.yaml
      # (host/src/spectral_host/golden/verify.py). No --no-env-check: CI IS the
      # environment the pins are compared against. A red step is a decision
      # request for a human (regenerate under a new name with a reason), not
      # something to fix in this workflow.
      - name: spectral-golden verify (never regenerates)
        run: uv run --project host spectral-golden verify
      # --- The licence boundary (ADR 0004), one failing step per direction. ---
      # Headers only (first 5 lines): the ADRs, NOTICE and this file all MENTION
      # the GPL in prose, and that is not a violation; a file that DECLARES
      # itself GPL outside host/ is. Fails closed like the GPIO19/20 scan: an
      # empty listing is a tooling error, never "clean".
      - name: boundary - no GPL SPDX header outside host/
        shell: bash
        run: |
          set -euo pipefail
          n=0; bad=0
          while IFS= read -r -d '' f; do
            [ -f "$f" ] || continue
            n=$((n + 1))
            if head -n 5 -- "$f" | grep -qE 'SPDX-License-Identifier:.*GPL'; then
              echo "::error file=$f::GPL SPDX header outside host/ (ADR 0004: the licence boundary is the directory)"
              bad=1
            fi
          done < <(git ls-files -z -- . ':!host')
          if [ "$n" -eq 0 ]; then
            echo "::error::git ls-files listed nothing -- the listing broke; refusing to pass"
            exit 2
          fi
          [ "$bad" -eq 0 ] && echo "clean: $n files scanned, 0 GPL headers outside host/"
          exit $bad
      # `git grep` exits 1 on no match, which is the only clean outcome here;
      # 0 (a match) and 2 (an error) both fail the step.
      - name: boundary - spectral_host is imported nowhere outside host/
        shell: bash
        run: |
          git grep -nE '^(from|import) spectral_host' -- . ':!host' && rc=0 || rc=$?
          case $rc in
            1) echo "clean: no import of spectral_host outside host/" ;;
            0) echo "::error::GPL package spectral_host imported outside host/ (ADR 0004)"; exit 1 ;;
            *) echo "::error::git grep failed (rc $rc); refusing to pass"; exit 2 ;;
          esac
      # Every .py under host/ (src, tests, golden alike): CLAUDE.md says "nothing
      # outside host/ is imported by host/", not only by the package.
      - name: boundary - nothing under host/ imports the Apache tooling
        shell: bash
        run: |
          git grep -nE '^(from|import) (synth_signals|golden_compare|check_presets|doc_ocr)' -- ':(glob)host/**/*.py' && rc=0 || rc=$?
          case $rc in
            1) echo "clean: host/ imports nothing from python-scripts/" ;;
            0) echo "::error::host/ reaches into python-scripts/ (ADR 0004: files on disk only)"; exit 1 ;;
            *) echo "::error::git grep failed (rc $rc); refusing to pass"; exit 2 ;;
          esac
      # host/src only: host/tests reads sys.path on purpose (test_env.py proves
      # python-scripts/ is not on it).
      - name: boundary - host/src does no sys.path surgery
        shell: bash
        run: |
          git grep -n 'sys\.path' -- host/src && rc=0 || rc=$?
          case $rc in
            1) echo "clean: host/src never touches sys.path" ;;
            0) echo "::error::host/src edits sys.path (ADR 0004: the only way a checkout-relative import crosses the directory)"; exit 1 ;;
            *) echo "::error::git grep failed (rc $rc); refusing to pass"; exit 2 ;;
          esac

  firmware:
    name: firmware build (${{ matrix.config }})
    # Enabled 2026-08-20 (roadmap E1): dependencies.lock committed, digest
    # re-derived with `docker buildx imagetools inspect` the same day.
    # Pipeline: digest-pinned container, idf-build-apps multi-config,
    # build-twice sha256 diff, size report, SBOM create + CVE check.
    runs-on: ubuntu-24.04
    container:
      image: espressif/idf:v6.0.2@sha256:0d8c9773d48a327233f9c1d7c654ff0bcf133ae24503ea2e97a57cfe02b8cb67
    # All four configs gate the merge. The analyzer config is blocking again
    # since ADR 0017 trimmed the component set and the top-level CMakeLists
    # scoped -fanalyzer to project + IDF code (registry components excluded).
    strategy:
      fail-fast: false
      matrix:
        config: [default, release, qemu, analyzer]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1              # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0                 # PROJECT_VER comes from `git describe`
      # The container UID differs from the checkout owner; git refuses otherwise.
      - run: git config --global --add safe.directory '*'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9                 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ matrix.config }}-${{ hashFiles('**/CMakeLists.txt', '**/idf_component.yml', '**/dependencies.lock', '**/sdkconfig.*') }}
          restore-keys: ccache-${{ matrix.config }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9                 # v6.1.0
        with:
          path: ~/.espressif/component_manager
          key: idfcomp-${{ hashFiles('**/idf_component.yml', '**/dependencies.lock') }}
      - name: Build (idf-build-apps)
        shell: bash
        env:
          IDF_CCACHE_ENABLE: '1'
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          . "$IDF_PATH/export.sh"
          pip install "idf-build-apps==3.0.2"
          idf-build-apps build -p "$FIRMWARE_DIR" -t "$IDF_TARGET" --recursive \
            --config-rules "sdkconfig.ci.${{ matrix.config }}=${{ matrix.config }}" \
            --build-dir "build_@t_@w" --check-warnings --keep-going \
            --size-json-filename size.json --collect-app-info "app_info_${{ matrix.config }}.json" \
            --junitxml "build-${{ matrix.config }}.xml"
      - name: dependencies.lock unchanged by the build
        run: git diff --exit-code -- "$FIRMWARE_DIR/dependencies.lock"
      - name: Reproducibility (build twice, diff sha256)
        if: matrix.config == 'release'
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd "$FIRMWARE_DIR"
          B="build_${IDF_TARGET}_release"
          sha256sum "$B"/*.bin "$B"/bootloader/bootloader.bin "$B"/partition_table/partition-table.bin | cut -d' ' -f1 > /tmp/a.sha
          idf.py -B "$B" fullclean
          idf.py -B "$B" build
          sha256sum "$B"/*.bin "$B"/bootloader/bootloader.bin "$B"/partition_table/partition-table.bin | cut -d' ' -f1 > /tmp/b.sha
          diff /tmp/a.sha /tmp/b.sha
      - name: Size report
        if: matrix.config == 'release'
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd "$FIRMWARE_DIR"
          idf.py -B "build_${IDF_TARGET}_release" size
          idf.py -B "build_${IDF_TARGET}_release" size-components
      - name: SBOM create + check (esp-idf-sbom)
        if: matrix.config == 'release'
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          pip install "esp-idf-sbom==1.3.1"
          cd "$FIRMWARE_DIR"
          # Pin the @version: a bare format name advances on major releases.
          esp-idf-sbom create --format cyclonedx-json@1.6 \
            -o "$GITHUB_WORKSPACE/sbom.cdx.json" \
            "build_${IDF_TARGET}_release/project_description.json"
          esp-idf-sbom check "$GITHUB_WORKSPACE/sbom.cdx.json"   # exit 1 == CVE or invalid manifest
      - name: Full licence scan (tags only)
        if: matrix.config == 'release' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd "$FIRMWARE_DIR"
          esp-idf-sbom create --format spdx-json@2.2 --file-tags \
            -o "$GITHUB_WORKSPACE/sbom.spdx.json" \
            "build_${IDF_TARGET}_release/project_description.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a       # v7.0.1
        with:
          name: firmware-${{ matrix.config }}
          path: |
            firmware/twatch-s3/build_*/**/*.bin
            firmware/twatch-s3/build_*/**/*.elf
