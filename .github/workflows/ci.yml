#
# Super Spectral CI. Phase 0 ("documentation & environment") runs the docs
# and Python jobs, plus the firmware job (enabled in roadmap E1 on
# 2026-08-20, once firmware/twatch-s3/dependencies.lock was committed) — see
# docs/roadmap/documentation-roadmap.md (E1) and ADR 0001.
#
# Third-party actions are pinned to full commit SHAs (the trailing comment is
# the release tag the SHA was resolved from, verified against the GitHub API
# on 2026-08-20). Major tags are repointable, so a bare `@vN` is not a pin.
# To bump: pick the new release tag, resolve it with
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha
# (dereference once more via repos/.../git/tags/<sha> if .object.type is
# "tag"), and update both the SHA and the comment together.

name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # ESP-IDF v6.0.2 (released 2026-06-29; Service to 2027-03-20, EOL 2028-09-20).
  # The multi-arch index digest below was captured 2026-08-20 and MUST be
  # re-derived in roadmap E1 before the firmware job is enabled — tags are
  # repointable, digests age:
  #   docker buildx imagetools inspect espressif/idf:v6.0.2 --format '{{println .Manifest.Digest}}'
  # This is the one place to bump it. Never use `latest` or `release-v6.0`.
  IDF_IMAGE: espressif/idf:v6.0.2@sha256:0d8c9773d48a327233f9c1d7c654ff0bcf133ae24503ea2e97a57cfe02b8cb67
  IDF_TARGET: esp32s3
  FIRMWARE_DIR: firmware/twatch-s3

jobs:

  markdown-lint:
    name: markdown lint (advisory)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1              # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: |
            **/*.md
            !docs/reference-projects/clones/**
            !scratch/**
        continue-on-error: true

  link-check:
    name: relative links resolve (lychee, offline)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1              # v7.0.1
      # Offline mode checks only local file links and heading fragments, which
      # is exactly the repo's cross-linking contract ("relative paths only, so
      # docs work on GitHub and offline"). External URLs are NOT checked here:
      # bibliography links decay on their own schedule and are re-verified in
      # acquisition passes (docs/bibliography/acquisition-status.md), not on
      # every push.
      - name: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8      # v2.9.0
        with:
          args: >-
            --offline
            --no-progress
            --include-fragments
            --exclude-path docs/reference-projects/clones
            --exclude-path scratch
            --root-dir ${{ github.workspace }}
            '**/*.md'
          fail: true

  # The eight `repo: local` hooks in .pre-commit-config.yaml are the project's
  # rules expressed as code: GPIO19/20 (the only recovery path on a sealed
  # board), the twatch_pins.h reserved-name rule, the sdkconfig anti-brick
  # invariants, the partition-table arithmetic, the preset/marker gates, and the
  # PDF-redistribution rule (a tracked document must be `redistributable=yes`).
  # Until 2026-08-21 they ran ONLY as local git hooks, and `pre-commit install`
  # had never been run — so CLAUDE.md's Never-rule 1, which promises "CI greps
  # for the literals", was describing a second line of defence that did not
  # exist. This job is that line. It runs the local hooks only: the upstream
  # hooks (clang-format, shellcheck, codespell, kconfig) are style and are the
  # developer's business, but these five are invariants.
  guard-hooks:
    name: safety hooks (GPIO19/20, sdkconfig, partitions, presets, markers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1              # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97          # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pre-commit and the preset validator
        run: python -m pip install --quiet "pre-commit>=3.5" "jsonschema>=4.10"
      # --all-files, not the diff: a rule added after a file was written must
      # still see that file. That is exactly how firmware/idf-gate/ went a day
      # without SPDX headers and how gate_main.c tripped a hook nobody had run.
      # One invocation per hook: `pre-commit run` takes a single hook id, and
      # passing several makes it exit 2 with "unrecognized arguments" -- which
      # looks like a failure but tests nothing. The loop keeps going so one red
      # hook does not hide the others, then fails at the end.
      - name: Run every repo-local guard hook over the whole tree
        run: |
          rc=0
          for h in pdf-redistributable spdx-header no-usb-pins pins-h-usb-reserved-only \
                   sdkconfig-invariants partitions-arithmetic \
                   presets-rules markers-baseline; do
            echo "::group::$h"
            pre-commit run --all-files "$h" || rc=1
            echo "::endgroup::"
          done
          exit $rc
      # Belt and braces for the one rule whose failure bricks the board: even if
      # the hook definition is ever edited away, this grep stays. It FAILS CLOSED:
      # the only path to "clean" is an explicit "no match" (grep rc 1) on every
      # file. The first version of this step sat under `set -o pipefail` inside
      # an `if`, so a sed or xargs error read as "no match" and printed clean --
      # the failure mode of a guard must never be silence. It also scans .cpp/.hpp
      # and drops comment lines exactly as the hook does, so the two cannot
      # disagree on the same tree.
      - name: GPIO19/20 appear nowhere in firmware sources (independent of the hook)
        shell: bash
        run: |
          set -euo pipefail
          # In a git pathspec `*` also matches `/`, so 'firmware/*.c' is every .c under firmware/.
          git ls-files -z -- 'firmware/*.c' 'firmware/*.h' 'firmware/*.cpp' 'firmware/*.hpp' \
            | tr '\0' '\n' | grep -vE '(^|/)twatch_pins\.h$' > files.lst || true
          if [ ! -s files.lst ]; then
            echo "::error::no firmware sources listed -- the listing broke; refusing to pass"
            exit 1
          fi
          : > matches.lst
          while IFS= read -r f; do
            sed 's/"[^"]*"/""/g' "$f" > blanked.txt            # under set -e a sed failure is fatal
            set +e
            grep -nE 'GPIO_NUM_(19|20)\b|\bGPIO(19|20)\b' blanked.txt \
              | grep -vE '^[0-9]+:[[:space:]]*(/\*|\*|//)' | sed "s|^|$f:|" >> matches.lst
            rcs=("${PIPESTATUS[@]}")
            set -e
            # grep: 0 match / 1 no match / 2 error; the filter grep likewise; sed must be 0.
            if [ "${rcs[0]}" -gt 1 ] || [ "${rcs[1]}" -gt 1 ] || [ "${rcs[2]}" -ne 0 ]; then
              echo "::error::tooling error scanning $f (grep ${rcs[0]}, filter ${rcs[1]}, sed ${rcs[2]})"
              exit 2
            fi
          done < files.lst
          if [ -s matches.lst ]; then
            cat matches.lst
            echo "::error::GPIO19/20 (USB-Serial-JTAG) referenced in firmware sources -- CLAUDE.md Never-rule 1"
            exit 1
          fi
          echo "clean: $(wc -l < files.lst) files scanned, 0 matches"

  python-scripts:
    name: python-scripts compile + doc_ocr tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1              # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97          # v7.0.0
        with:
          python-version: "3.12"
      - name: Syntax-check every Python script
        run: python -m compileall -q python-scripts
      # doc_ocr has no runtime dependencies on purpose (it shells out to
      # poppler/mutool); its tests use captured tool output as fixtures, so
      # they need pytest only. host/ is GPL and has its own environment; it
      # is not compiled here.
      - name: doc_ocr unit tests
        run: |
          python -m pip install --quiet "pytest>=8"
          cd python-scripts/doc_ocr
          python -m pytest -q
      # The presets are a protocol, not configuration: the watch rejects a file
      # that fails any rule in protocols/specs/preset-schema.md section 6, so a
      # rule that quietly stops being true here would ship a preset the device
      # refuses to load. Runs the schema (draft 2020-12) and rules V0-V10 over
      # every shipped preset, plus a negative-case suite that must be rejected.
      # A marker (verify)/(prov.)/unread is a promise to come back. This counts
      # them against a baseline: a correction that comes undone fails, and a new
      # marker without an owner fails. See python-scripts/check_markers.py.
      - name: unresolved-value markers are closed or owned
        run: |
          python python-scripts/check_markers.py --self-test
          python python-scripts/check_markers.py \
            --closed docs/roadmap/markers-closed-2026-08-21.tsv \
            --allow docs/roadmap/markers-allowlist.tsv
      - name: preset schema + loader rules V0-V10
        run: |
          python -m pip install --quiet "jsonschema>=4.10"
          python python-scripts/check_presets.py --verbose

  firmware:
    name: firmware build (${{ matrix.config }})
    # Enabled 2026-08-20 (roadmap E1): dependencies.lock committed, digest
    # re-derived with `docker buildx imagetools inspect` the same day.
    # Pipeline: digest-pinned container, idf-build-apps multi-config,
    # build-twice sha256 diff, size report, SBOM create + CVE check.
    runs-on: ubuntu-24.04
    container:
      image: espressif/idf:v6.0.2@sha256:0d8c9773d48a327233f9c1d7c654ff0bcf133ae24503ea2e97a57cfe02b8cb67
    # All four configs gate the merge. The analyzer config is blocking again
    # since ADR 0017 trimmed the component set and the top-level CMakeLists
    # scoped -fanalyzer to project + IDF code (registry components excluded).
    strategy:
      fail-fast: false
      matrix:
        config: [default, release, qemu, analyzer]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1              # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0                 # PROJECT_VER comes from `git describe`
      # The container UID differs from the checkout owner; git refuses otherwise.
      - run: git config --global --add safe.directory '*'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9                 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ matrix.config }}-${{ hashFiles('**/CMakeLists.txt', '**/idf_component.yml', '**/dependencies.lock', '**/sdkconfig.*') }}
          restore-keys: ccache-${{ matrix.config }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9                 # v6.1.0
        with:
          path: ~/.espressif/component_manager
          key: idfcomp-${{ hashFiles('**/idf_component.yml', '**/dependencies.lock') }}
      - name: Build (idf-build-apps)
        shell: bash
        env:
          IDF_CCACHE_ENABLE: '1'
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          . "$IDF_PATH/export.sh"
          pip install "idf-build-apps==3.0.2"
          idf-build-apps build -p "$FIRMWARE_DIR" -t "$IDF_TARGET" --recursive \
            --config-rules "sdkconfig.ci.${{ matrix.config }}=${{ matrix.config }}" \
            --build-dir "build_@t_@w" --check-warnings --keep-going \
            --size-json-filename size.json --collect-app-info "app_info_${{ matrix.config }}.json" \
            --junitxml "build-${{ matrix.config }}.xml"
      - name: dependencies.lock unchanged by the build
        run: git diff --exit-code -- "$FIRMWARE_DIR/dependencies.lock"
      - name: Reproducibility (build twice, diff sha256)
        if: matrix.config == 'release'
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd "$FIRMWARE_DIR"
          B="build_${IDF_TARGET}_release"
          sha256sum "$B"/*.bin "$B"/bootloader/bootloader.bin "$B"/partition_table/partition-table.bin | cut -d' ' -f1 > /tmp/a.sha
          idf.py -B "$B" fullclean
          idf.py -B "$B" build
          sha256sum "$B"/*.bin "$B"/bootloader/bootloader.bin "$B"/partition_table/partition-table.bin | cut -d' ' -f1 > /tmp/b.sha
          diff /tmp/a.sha /tmp/b.sha
      - name: Size report
        if: matrix.config == 'release'
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd "$FIRMWARE_DIR"
          idf.py -B "build_${IDF_TARGET}_release" size
          idf.py -B "build_${IDF_TARGET}_release" size-components
      - name: SBOM create + check (esp-idf-sbom)
        if: matrix.config == 'release'
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          pip install "esp-idf-sbom==1.3.1"
          cd "$FIRMWARE_DIR"
          # Pin the @version: a bare format name advances on major releases.
          esp-idf-sbom create --format cyclonedx-json@1.6 \
            -o "$GITHUB_WORKSPACE/sbom.cdx.json" \
            "build_${IDF_TARGET}_release/project_description.json"
          esp-idf-sbom check "$GITHUB_WORKSPACE/sbom.cdx.json"   # exit 1 == CVE or invalid manifest
      - name: Full licence scan (tags only)
        if: matrix.config == 'release' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd "$FIRMWARE_DIR"
          esp-idf-sbom create --format spdx-json@2.2 --file-tags \
            -o "$GITHUB_WORKSPACE/sbom.spdx.json" \
            "build_${IDF_TARGET}_release/project_description.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a       # v7.0.1
        with:
          name: firmware-${{ matrix.config }}
          path: |
            firmware/twatch-s3/build_*/**/*.bin
            firmware/twatch-s3/build_*/**/*.elf
            firmware/twatch-s3/build_*/**/*.map
            firmware/twatch-s3/build_*/**/flasher_args.json
            firmware/twatch-s3/build_*/**/project_description.json
            firmware/twatch-s3/build_*/**/sdkconfig
            **/size.json
            build-*.xml
            sbom.*.json
          retention-days: 30
          if-no-files-found: error

  # Deferred jobs, in the order they are worth adding (devenv synthesis §6.11):
  #   host-tests     — cmake -S host-tests -B host-tests/build && ctest; the moment
  #                    spectral_core has sources (host-tests/README.md)
  #   qemu-tests     — pytest-embedded 2.8.1 against firmware-qemu, once the
  #                    audio-source and display-backend seams exist (tests/README.md)
  #   size-diff      — idf.py size --diff against the PR base, same image digest
  #   lvgl-native    — LVGL screenshot regression for the analyzer widgets
  #   static-analysis— IDF_TOOLCHAIN=clang clang-check (advisory), cppcheck on spectral_*
  #   env-lock-diff  — tools/env-lock.sh output vs docs/devenv/env.lock.md
  #   hil            — self-hosted runner, OTA-slot-only flashing, never on fork PRs
