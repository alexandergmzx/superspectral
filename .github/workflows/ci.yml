#
# Super Spectral CI. Phase 0 ("documentation & environment") runs the docs
# and Python jobs, plus the firmware job (enabled in roadmap E1 on
# 2026-08-20, once firmware/twatch-s3/dependencies.lock was committed) — see
# docs/roadmap/documentation-roadmap.md (E1) and ADR 0001.
#
# Third-party actions are pinned to full commit SHAs (the trailing comment is
# the release tag the SHA was resolved from, verified against the GitHub API
# on 2026-08-20). Major tags are repointable, so a bare `@vN` is not a pin.
# To bump: pick the new release tag, resolve it with
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha
# (dereference once more via repos/.../git/tags/<sha> if .object.type is
# "tag"), and update both the SHA and the comment together.

name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # ESP-IDF v6.0.2 (released 2026-06-29; Service to 2027-03-20, EOL 2028-09-20).
  # The multi-arch index digest below was captured 2026-08-20 and MUST be
  # re-derived in roadmap E1 before the firmware job is enabled — tags are
  # repointable, digests age:
  #   docker buildx imagetools inspect espressif/idf:v6.0.2 --format '{{println .Manifest.Digest}}'
  # This is the one place to bump it. Never use `latest` or `release-v6.0`.
  IDF_IMAGE: espressif/idf:v6.0.2@sha256:0d8c9773d48a327233f9c1d7c654ff0bcf133ae24503ea2e97a57cfe02b8cb67
  IDF_TARGET: esp32s3
  FIRMWARE_DIR: firmware/twatch-s3

jobs:

  markdown-lint:
    name: markdown lint (advisory)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1              # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: |
            **/*.md
            !docs/reference-projects/clones/**
            !scratch/**
        continue-on-error: true

  link-check:
    name: relative links resolve (lychee, offline)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1              # v7.0.1
      # Offline mode checks only local file links and heading fragments, which
      # is exactly the repo's cross-linking contract ("relative paths only, so
      # docs work on GitHub and offline"). External URLs are NOT checked here:
      # bibliography links decay on their own schedule and are re-verified in
      # acquisition passes (docs/bibliography/acquisition-status.md), not on
      # every push.
      - name: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8      # v2.9.0
        with:
          args: >-
            --offline
            --no-progress
            --include-fragments
            --exclude-path docs/reference-projects/clones
            --exclude-path scratch
            --root-dir ${{ github.workspace }}
            '**/*.md'
          fail: true

  python-scripts:
    name: python-scripts compile + doc_ocr tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1              # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97          # v7.0.0
        with:
          python-version: "3.12"
      - name: Syntax-check every Python script
        run: python -m compileall -q python-scripts
      # doc_ocr has no runtime dependencies on purpose (it shells out to
      # poppler/mutool); its tests use captured tool output as fixtures, so
      # they need pytest only. host/ is GPL and has its own environment; it
      # is not compiled here.
      - name: doc_ocr unit tests
        run: |
          python -m pip install --quiet "pytest>=8"
          cd python-scripts/doc_ocr
          python -m pytest -q

  firmware:
    name: firmware build (${{ matrix.config }})
    # Enabled 2026-08-20 (roadmap E1): dependencies.lock committed, digest
    # re-derived with `docker buildx imagetools inspect` the same day.
    # Pipeline: digest-pinned container, idf-build-apps multi-config,
    # build-twice sha256 diff, size report, SBOM create + CVE check.
    runs-on: ubuntu-24.04
    container:
      image: espressif/idf:v6.0.2@sha256:0d8c9773d48a327233f9c1d7c654ff0bcf133ae24503ea2e97a57cfe02b8cb67
    # All four configs gate the merge. The analyzer config is blocking again
    # since ADR 0017 trimmed the component set and the top-level CMakeLists
    # scoped -fanalyzer to project + IDF code (registry components excluded).
    strategy:
      fail-fast: false
      matrix:
        config: [default, release, qemu, analyzer]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1              # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0                 # PROJECT_VER comes from `git describe`
      # The container UID differs from the checkout owner; git refuses otherwise.
      - run: git config --global --add safe.directory '*'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9                 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ matrix.config }}-${{ hashFiles('**/CMakeLists.txt', '**/idf_component.yml', '**/dependencies.lock', '**/sdkconfig.*') }}
          restore-keys: ccache-${{ matrix.config }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9                 # v6.1.0
        with:
          path: ~/.espressif/component_manager
          key: idfcomp-${{ hashFiles('**/idf_component.yml', '**/dependencies.lock') }}
      - name: Build (idf-build-apps)
        shell: bash
        env:
          IDF_CCACHE_ENABLE: '1'
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          . "$IDF_PATH/export.sh"
          pip install "idf-build-apps==3.0.2"
          idf-build-apps build -p "$FIRMWARE_DIR" -t "$IDF_TARGET" --recursive \
            --config-rules "sdkconfig.ci.${{ matrix.config }}=${{ matrix.config }}" \
            --build-dir "build_@t_@w" --check-warnings --keep-going \
            --size-json-filename size.json --collect-app-info "app_info_${{ matrix.config }}.json" \
            --junitxml "build-${{ matrix.config }}.xml"
      - name: dependencies.lock unchanged by the build
        run: git diff --exit-code -- "$FIRMWARE_DIR/dependencies.lock"
      - name: Reproducibility (build twice, diff sha256)
        if: matrix.config == 'release'
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd "$FIRMWARE_DIR"
          B="build_${IDF_TARGET}_release"
          sha256sum "$B"/*.bin "$B"/bootloader/bootloader.bin "$B"/partition_table/partition-table.bin | cut -d' ' -f1 > /tmp/a.sha
          idf.py -B "$B" fullclean
          idf.py -B "$B" build
          sha256sum "$B"/*.bin "$B"/bootloader/bootloader.bin "$B"/partition_table/partition-table.bin | cut -d' ' -f1 > /tmp/b.sha
          diff /tmp/a.sha /tmp/b.sha
      - name: Size report
        if: matrix.config == 'release'
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd "$FIRMWARE_DIR"
          idf.py -B "build_${IDF_TARGET}_release" size
          idf.py -B "build_${IDF_TARGET}_release" size-components
      - name: SBOM create + check (esp-idf-sbom)
        if: matrix.config == 'release'
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          pip install "esp-idf-sbom==1.3.1"
          cd "$FIRMWARE_DIR"
          # Pin the @version: a bare format name advances on major releases.
          esp-idf-sbom create --format cyclonedx-json@1.6 \
            -o "$GITHUB_WORKSPACE/sbom.cdx.json" \
            "build_${IDF_TARGET}_release/project_description.json"
          esp-idf-sbom check "$GITHUB_WORKSPACE/sbom.cdx.json"   # exit 1 == CVE or invalid manifest
      - name: Full licence scan (tags only)
        if: matrix.config == 'release' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd "$FIRMWARE_DIR"
          esp-idf-sbom create --format spdx-json@2.2 --file-tags \
            -o "$GITHUB_WORKSPACE/sbom.spdx.json" \
            "build_${IDF_TARGET}_release/project_description.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a       # v7.0.1
        with:
          name: firmware-${{ matrix.config }}
          path: |
            firmware/twatch-s3/build_*/**/*.bin
            firmware/twatch-s3/build_*/**/*.elf
            firmware/twatch-s3/build_*/**/*.map
            firmware/twatch-s3/build_*/**/flasher_args.json
            firmware/twatch-s3/build_*/**/project_description.json
            firmware/twatch-s3/build_*/**/sdkconfig
            **/size.json
            build-*.xml
            sbom.*.json
          retention-days: 30
          if-no-files-found: error

  # Deferred jobs, in the order they are worth adding (devenv synthesis §6.11):
  #   host-tests     — cmake -S host-tests -B host-tests/build && ctest; the moment
  #                    spectral_core has sources (host-tests/README.md)
  #   qemu-tests     — pytest-embedded 2.8.1 against firmware-qemu, once the
  #                    audio-source and display-backend seams exist (tests/README.md)
  #   size-diff      — idf.py size --diff against the PR base, same image digest
  #   lvgl-native    — LVGL screenshot regression for the analyzer widgets
  #   static-analysis— IDF_TOOLCHAIN=clang clang-check (advisory), cppcheck on spectral_*
  #   env-lock-diff  — tools/env-lock.sh output vs docs/devenv/env.lock.md
  #   hil            — self-hosted runner, OTA-slot-only flashing, never on fork PRs
